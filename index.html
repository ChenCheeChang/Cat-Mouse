<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>貓抓老鼠 — 迷宮救援</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-drag: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    html, body {
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      touch-action: none !important;
      position: fixed;
      inset: 0;
    }
    ::selection { background: transparent !important; color: inherit !important; }
    .ios-glass {
      background: rgba(15, 23, 42, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
    }
    .ios-shell {
      background: rgba(10, 15, 30, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    canvas {
      touch-action: none !important;
      display: block;
    }
    .dpad-btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 100%);
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 3px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: background 0.08s ease, box-shadow 0.08s ease;
    }
    .dpad-btn-active {
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 100%) !important;
      color: #0f172a !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.8) !important;
    }
    .hero-float {
      animation: heroFloat 2.6s ease-in-out infinite;
    }
    @keyframes heroFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body id="app-body" class="w-full h-full overflow-hidden text-white flex flex-col items-center justify-between p-1.5 sm:p-2.5 select-none" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

  <!-- ===================================================================== -->
  <!-- 1. GAME HOME MENU SCREEN (DEFAULT LANDING, ZERO SCROLL)               -->
  <!-- ===================================================================== -->
  <div id="home-menu-screen" class="fixed inset-0 z-40 flex items-center justify-center p-3 bg-slate-950/88">
    <div class="w-full max-w-[390px] ios-shell rounded-[36px] p-5 sm:p-6 flex flex-col items-center text-center relative overflow-hidden">

      <!-- Dynamic Island Accent -->
      <div class="w-28 h-3.5 bg-black rounded-full mb-4 flex items-center justify-between px-3 border border-white/15">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      </div>

      <!-- Handcrafted Hero Emblem -->
      <div class="hero-float w-24 h-24 rounded-3xl bg-gradient-to-br from-amber-300 via-orange-500 to-rose-600 p-1 shadow-2xl mb-3 border-2 border-white/40 flex items-center justify-center">
        <div class="w-full h-full rounded-[20px] bg-slate-950/85 flex items-center justify-center text-4xl gap-0.5">
          <span>🐱</span><span class="text-2xl">💨</span><span>🐭</span>
        </div>
      </div>

      <h1 class="text-3xl font-black tracking-tight text-white drop-shadow">貓抓老鼠</h1>

      <!-- Clean Minimal Options Card -->
      <div class="w-full ios-glass rounded-2xl p-4 my-4 text-left space-y-3.5">
        <div class="flex items-center justify-between text-xs font-bold">
          <span class="text-white/75">當前關卡</span>
          <span id="home-level-label" class="text-amber-300 font-black">第 1 / 20 關 · 正方形</span>
        </div>

        <div class="flex items-center justify-between text-xs font-bold">
          <span class="text-white/75">最高紀錄</span>
          <span id="home-best-score" class="text-cyan-300 font-black">0 分</span>
        </div>

        <div>
          <div class="flex items-center justify-between text-xs font-bold mb-1.5">
            <span class="text-white/75">鏡頭視野</span>
            <span id="home-cam-label" class="text-emerald-300 font-black">9×9</span>
          </div>
          <input id="home-slider-cam" type="range" min="8" max="14" step="1" value="9" class="w-full accent-emerald-400 cursor-pointer h-1.5 bg-white/20 rounded-lg" />
        </div>

        <button id="btn-HomeToggleAudio" type="button" class="w-full ios-glass hover:bg-white/15 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
          <span id="home-audio-icon">🔊</span>
          <span id="home-audio-text">音效：開</span>
        </button>
      </div>

      <!-- Primary Start / Resume CTA -->
      <button id="btn-StartFromHome" type="button" class="w-full py-3.5 px-5 rounded-2xl font-black text-base shadow-xl bg-gradient-to-r from-amber-300 via-amber-400 to-orange-500 text-slate-950 border-2 border-white/60 flex items-center justify-center gap-2 active:opacity-90">
        <span>▶️</span>
        <span id="btn-StartFromHome-text">開始遊戲</span>
      </button>

      <!-- Home Indicator -->
      <div class="w-28 h-1 bg-white/30 rounded-full mt-5"></div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 2. COMPACT TOP BAR (SINGLE LINE, ZERO CLUTTER)                        -->
  <!-- ===================================================================== -->
  <header class="w-full max-w-[440px] ios-glass rounded-2xl px-3 py-1.5 flex items-center justify-between gap-2 z-20 shrink-0">
    <div class="flex items-center gap-2 min-w-0">
      <div id="theme-badge" class="w-8 h-8 rounded-xl flex items-center justify-center text-base shadow-inner font-bold border border-white/40 shrink-0">
        🐭
      </div>
      <div class="truncate">
        <div class="text-sm font-black tracking-tight leading-none truncate">貓抓老鼠</div>
        <div id="level-subtitle" class="text-[11px] text-white/85 font-bold mt-0.5 truncate">第 1 / 20 關 · 正方形</div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-ReturnHome" type="button" class="ios-glass hover:bg-white/20 w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center" title="首頁">🏠</button>
      <button id="btn-ToggleBGM" type="button" class="ios-glass hover:bg-white/20 w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center" title="靜音切換">
        <span id="bgm-icon">🔊</span>
      </button>
      <button id="btn-Pause" type="button" class="ios-glass hover:bg-white/20 w-8 h-8 rounded-xl text-xs font-bold flex items-center justify-center" title="暫停">
        <span id="pause-icon">⏸️</span>
      </button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 3. FULLSCREEN ZERO-SCROLL iPHONE GAME SHELL                           -->
  <!-- ===================================================================== -->
  <main class="w-full max-w-[440px] flex-1 min-h-0 flex flex-col my-1 z-10 overflow-hidden">
    <section class="w-full h-full min-h-0 ios-shell rounded-[32px] p-2.5 sm:p-3 flex flex-col items-center justify-between relative overflow-hidden">

      <!-- Top HUD Strip -->
      <div class="w-full shrink-0 space-y-1.5">
        <div class="w-full flex items-center justify-between gap-2">
          <div class="h-4 bg-black/90 rounded-full px-2.5 flex items-center gap-1.5 border border-white/15">
            <span id="danger-led" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="island-status" class="text-[9px] text-white/85 font-extrabold tracking-wider">L1</span>
          </div>
          <div id="mission-banner" class="flex-1 rounded-lg px-2.5 py-0.5 text-[11px] font-extrabold flex items-center justify-between shadow-inner truncate">
            <span id="mission-text" class="truncate">🐭 0 / 2</span>
            <span id="shape-pill" class="px-1.5 py-0.2 rounded text-[10px] bg-black/35 text-white font-extrabold shrink-0">20×20</span>
          </div>
        </div>

        <div class="w-full grid grid-cols-4 gap-1 text-center">
          <div class="ios-glass rounded-xl py-0.5 px-1">
            <div class="text-[9px] text-white/65 leading-tight">生命</div>
            <div id="hud-lives" class="text-xs font-black leading-tight">❤️❤️❤️</div>
          </div>
          <div class="ios-glass rounded-xl py-0.5 px-1">
            <div class="text-[9px] text-white/65 leading-tight">幼鼠</div>
            <div id="hud-babies" class="text-xs font-black leading-tight text-yellow-300">🐭 0/2</div>
          </div>
          <div class="ios-glass rounded-xl py-0.5 px-1">
            <div class="text-[9px] text-white/65 leading-tight">續關/惡貓</div>
            <div id="hud-cats" class="text-xs font-black leading-tight text-rose-300">🔄10 · 🐱2</div>
          </div>
          <div class="ios-glass rounded-xl py-0.5 px-1">
            <div class="text-[9px] text-white/65 leading-tight">積分</div>
            <div id="hud-score" class="text-xs font-black leading-tight text-cyan-200">0</div>
          </div>
        </div>
      </div>

      <!-- Flexible Full-Fit Maze Canvas -->
      <div id="canvas-wrapper" class="w-full flex-1 min-h-0 my-1.5 rounded-2xl overflow-hidden relative shadow-inner border border-white/25 bg-slate-950 flex items-center justify-center touch-none">
        <canvas id="maze-canvas" class="w-full h-full block"></canvas>

        <!-- Non-intrusive Toast Badge -->
        <div id="cartoon-popup" class="pointer-events-none absolute top-2 left-1/2 -translate-x-1/2 px-3 py-0.5 rounded-full font-black text-xs shadow-lg opacity-0 transition-opacity duration-150 bg-yellow-300 text-slate-950 border border-slate-900 z-30">
          🐭 +1
        </div>

        <!-- Cat Proximity Tension Vignette -->
        <div id="tension-vignette" class="pointer-events-none absolute inset-0 rounded-2xl opacity-0 z-10" style="box-shadow: inset 0 0 46px rgba(244, 63, 94, 0.88);"></div>

        <!-- Pause / All-Clear Celebration Overlay -->
        <div id="canvas-overlay" class="absolute inset-0 bg-slate-950/90 hidden flex-col items-center justify-center p-4 text-center z-20">
          <div id="overlay-emoji" class="text-4xl mb-1.5">⏸️</div>
          <h2 id="overlay-title" class="text-lg font-black tracking-tight mb-1">已暫停</h2>
          <p id="overlay-desc" class="text-xs text-white/80 max-w-xs leading-relaxed mb-3"></p>
          <div class="flex flex-wrap items-center justify-center gap-2 w-full max-w-xs">
            <button id="btn-OverlayPrimary" type="button" class="flex-1 py-2.5 px-4 rounded-xl font-black text-xs sm:text-sm shadow-lg bg-gradient-to-r from-amber-300 to-orange-500 text-slate-950">
              ▶️ 繼續
            </button>
            <button id="btn-OverlaySecondary" type="button" class="py-2.5 px-3.5 rounded-xl font-bold text-xs ios-glass hover:bg-white/20 hidden">
              🏠 首頁
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Ergonomic Controller Bar (Left: Restart/Guide | RIGHT: 4-Way D-Pad) -->
      <div class="w-full shrink-0 flex items-center justify-between gap-2 px-1 touch-none">

        <!-- Left: Clean Utility Controls (Restart & Levels 1-3 Guide Toggle) -->
        <div class="flex flex-col items-stretch justify-center gap-2 min-w-[112px]">
          <button id="btn-Restart" type="button" class="ios-glass hover:bg-white/20 px-3.5 py-2.5 rounded-2xl flex items-center justify-center font-bold text-xs gap-1.5 shadow w-full active:opacity-80">
            <span>🔄</span><span>重設本關</span>
          </button>
          <button id="btn-ToggleBFS" type="button" class="ios-glass hover:bg-white/20 px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow w-full justify-center active:opacity-80">
            <span>🧭</span>
            <span id="bfs-toggle-text">引導: 關</span>
          </button>
        </div>

        <!-- RIGHT: Strict 4-Way Cardinal D-Pad for Right-Hand Thumb -->
        <div id="dpad-pad" class="relative grid grid-cols-3 gap-1 w-32 h-28 sm:w-36 sm:h-28 touch-none select-none p-1 rounded-2xl bg-slate-900/95 border border-white/25 shadow-inner shrink-0">
          <div></div>
          <button id="dpad-up" data-dir="U" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▲</button>
          <div></div>
          <button id="dpad-left" data-dir="L" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">◀</button>
          <div class="rounded-full bg-white/10 border border-white/20 flex items-center justify-center pointer-events-none">
            <div id="dpad-nub" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-amber-400 shadow transition-transform duration-75"></div>
          </div>
          <button id="dpad-right" data-dir="R" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▶</button>
          <div></div>
          <button id="dpad-down" data-dir="D" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▼</button>
          <div></div>
        </div>

      </div>
    </section>
  </main>

  <script>
    // =========================================================================

    // =========================================================================
    window.addEventListener('selectstart', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('dragstart', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (e.target.type !== 'range') e.preventDefault();
    }, { passive: false });

      playStepPluck(stepCount) {

      startChaseBGM() {
        this.stopChaseBGM();
        if (!this.bgmEnabled) return;
        this.init();
        const calmBass = [130.81, 196.00, 146.83, 196.00, 164.81, 196.00, 146.83, 196.00];
        const calmMelody = [523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 698.46];
        const panicBass = [146.83, 155.56, 164.81, 174.61, 185.00, 196.00, 207.65, 220.00];
        const panicMelody = [880.0, 932.33, 987.77, 1046.5, 1108.73, 1046.5, 987.77, 932.33];

        const tickNote = () => {
          if (!this.bgmEnabled || !this.ctx || gameState.status !== 'playing') return;
          const now = this.ctx.currentTime;
          const t = this.tensionLevel;
          const idx = this.stepIndex % 8;
          this.stepIndex++;

          const isPanic = t > 0.3;
          const bassFreq = isPanic ? panicBass[idx] * (1 + t * 0.16) : calmBass[idx];
          const melFreq = isPanic ? panicMelody[idx] : calmMelody[idx];

          const bassOsc = this.ctx.createOscillator();
          const bassGain = this.ctx.createGain();
          bassOsc.type = isPanic ? 'sawtooth' : 'triangle';
          bassOsc.frequency.setValueAtTime(bassFreq, now);
          bassGain.gain.setValueAtTime(isPanic ? 0.068 : 0.042, now);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + (isPanic ? 0.08 : 0.12));
          bassOsc.connect(bassGain);
          bassGain.connect(this.ctx.destination);
          bassOsc.start(now);
          bassOsc.stop(now + (isPanic ? 0.085 : 0.13));

          if (isPanic || idx % 2 === 0 || idx === 7) {
            const melOsc = this.ctx.createOscillator();
            const melGain = this.ctx.createGain();
            melOsc.type = isPanic ? 'square' : 'sine';
            melOsc.frequency.setValueAtTime(melFreq, now + 0.035);
            melGain.gain.setValueAtTime(isPanic ? 0.042 : 0.028, now + 0.035);
            melGain.gain.exponentialRampToValueAtTime(0.001, now + (isPanic ? 0.095 : 0.15));
            melOsc.connect(melGain);
            melGain.connect(this.ctx.destination);
            melOsc.start(now + 0.035);
            melOsc.stop(now + (isPanic ? 0.1 : 0.16));
          }

          const nextDelay = Math.round(235 - t * 145);
          this.bgmTimeout = setTimeout(tickNote, Math.max(85, nextDelay));
        };
        tickNote();
      }

      stopChaseBGM() {
        if (this.bgmTimeout) {
          clearTimeout(this.bgmTimeout);
          this.bgmTimeout = null;
        }
      }

    // =========================================================================
    // 3. ZERO-DEAD-END BRAIDED MAZE ENGINE (100% CONNECTED + MULTI-ROUTE)
    // =========================================================================
    function isCellInsideShape(r, c, rows, cols, shapeId) {
      const ny = ((r + 0.5) / rows) * 2 - 1;
      const nx = ((c + 0.5) / cols) * 2 - 1;
      switch (shapeId) {
        case 'square': return true;
        case 'rectangle': return Math.abs(ny) <= 0.72;
        case 'triangle': {
          const py = (r + 0.5) / rows;
          if (py < 0.06 || py > 0.96) return false;
          return Math.abs(nx) <= (0.14 + py * 0.82);
        }
        case 'circle': return (nx * nx + ny * ny) <= 0.92;
        case 'diamond': return (Math.abs(nx) + Math.abs(ny)) <= 1.22;
        case 'ellipse': return ((nx * nx) / (0.98 * 0.98) + (ny * ny) / (0.68 * 0.68)) <= 1.0;
        case 'hexagon': return Math.abs(ny) <= 0.9 && (Math.abs(nx) * 0.86 + Math.abs(ny) * 0.5) <= 0.92;
        case 'star': {
          const angle = Math.atan2(ny, nx);
          const dist = Math.sqrt(nx * nx + ny * ny);
          return dist <= (0.68 + 0.26 * Math.cos(5 * (angle + Math.PI / 2)));
        }
        case 'heart': {
          const x = nx * 1.18;
          const y = -ny * 1.15 + 0.15;
          return (Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3)) <= 0.08;
        }
        case 'hourglass': return Math.abs(nx) <= (0.34 + 0.64 * Math.abs(ny)) && Math.abs(ny) <= 0.95;
        case 'cross': return (Math.abs(nx) <= 0.42 && Math.abs(ny) <= 0.95) || (Math.abs(ny) <= 0.42 && Math.abs(nx) <= 0.95);
        case 'ring': {
          const r2 = nx * nx + ny * ny;
          return r2 <= 0.92 && r2 >= 0.13;
        }
        case 'octagon': return Math.abs(nx) <= 0.92 && Math.abs(ny) <= 0.92 && (Math.abs(nx) + Math.abs(ny)) <= 1.38;
        case 'crescent': {
          const outer = (nx * nx + ny * ny) <= 0.94;
          const innerCut = ((nx - 0.52) * (nx - 0.52) + ny * ny) >= 0.40;
          return outer && innerCut;
        }
        case 'clover': {
          const p1 = (nx - 0.40) ** 2 + (ny - 0.40) ** 2 <= 0.29;
          const p2 = (nx + 0.40) ** 2 + (ny - 0.40) ** 2 <= 0.29;
          const p3 = (nx - 0.40) ** 2 + (ny + 0.40) ** 2 <= 0.29;
          const p4 = (nx + 0.40) ** 2 + (ny + 0.40) ** 2 <= 0.29;
          const core = (nx * nx + ny * ny) <= 0.22;
          return p1 || p2 || p3 || p4 || core;
        }
        case 'shield': {
          if (ny < -0.88 || ny > 0.94) return false;
          if (ny <= 0.05) return Math.abs(nx) <= 0.86;
          const t = (ny - 0.05) / 0.89;
          return Math.abs(nx) <= 0.86 * (1 - t * t * 0.88);
        }
        case 'butterfly': {
          const body = Math.abs(nx) <= 0.26 && Math.abs(ny) <= 0.72;
          const upperL = ((nx + 0.50) / 0.46) ** 2 + ((ny + 0.34) / 0.46) ** 2 <= 1.0;
          const upperR = ((nx - 0.50) / 0.46) ** 2 + ((ny + 0.34) / 0.46) ** 2 <= 1.0;
          const lowerL = ((nx + 0.44) / 0.40) ** 2 + ((ny - 0.36) / 0.42) ** 2 <= 1.0;
          const lowerR = ((nx - 0.44) / 0.40) ** 2 + ((ny - 0.36) / 0.42) ** 2 <= 1.0;
          return body || upperL || upperR || lowerL || lowerR;
        }
        case 'castle': {
          if (ny > 0.92 || ny < -0.92 || Math.abs(nx) > 0.90) return false;
          if (ny >= -0.38) return true;
          return Math.abs(nx) >= 0.46 || Math.abs(nx) <= 0.24;
        }
        case 'crown': {
          if (ny > 0.88 || ny < -0.88 || Math.abs(nx) > 0.92) return false;
          if (ny >= 0.05) return Math.abs(nx) <= (0.88 - (ny - 0.05) * 0.14);
          const peakCenter = Math.abs(nx) <= 0.26 * (1 - (-ny) * 0.45);
          const peakLeft = nx <= -0.34 && nx >= -0.90 && ny >= -0.78 + Math.abs(nx + 0.62) * 1.4;
          const peakRight = nx >= 0.34 && nx <= 0.90 && ny >= -0.78 + Math.abs(nx - 0.62) * 1.4;
          const band = ny >= -0.22 && Math.abs(nx) <= 0.88;
          return peakCenter || peakLeft || peakRight || band;
        }
        case 'grand_star': {
          const angle = Math.atan2(ny, nx);
          const dist = Math.sqrt(nx * nx + ny * ny);
          return dist <= (0.76 + 0.19 * Math.cos(8 * angle));
        }
        default: return true;
      }
    }

    function buildConnectedShapeMask(rows, cols, shapeId) {
      const raw = Array.from({ length: rows }, (_, r) =>
        Array.from({ length: cols }, (_, c) => isCellInsideShape(r, c, rows, cols, shapeId))
      );
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let changed = true;
      while (changed) {
        changed = false;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (!raw[r][c]) continue;
            let cnt = 0;
            for (const [dr, dc] of dirs) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && raw[nr][nc]) cnt++;
            }
            if (cnt < 2) { raw[r][c] = false; changed = true; }
          }
        }
      }

      const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
      let bestComponent = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (raw[r][c] && !visited[r][c]) {
            const comp = [];
            const q = [[r, c]];
            visited[r][c] = true;
            while (q.length > 0) {
              const [cr, cc] = q.shift();
              comp.push([cr, cc]);
              for (const [dr, dc] of dirs) {
                const nr = cr + dr, nc = cc + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && raw[nr][nc] && !visited[nr][nc]) {
                  visited[nr][nc] = true;
                  q.push([nr, nc]);
                }
              }
            }
            if (comp.length > bestComponent.length) bestComponent = comp;
          }
        }
      }

      const validMask = Array.from({ length: rows }, () => Array(cols).fill(false));
      for (const [r, c] of bestComponent) validMask[r][c] = true;
      return { validMask, cells: bestComponent };
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function computeBFSReachability(grid, startR, startC) {
      const rows = grid.length;
      const cols = grid[0].length;
      const distMap = Array.from({ length: rows }, () => Array(cols).fill(-1));
      const parentMap = Array.from({ length: rows }, () => Array(cols).fill(null));
      const r0 = Math.max(0, Math.min(rows - 1, Math.round(startR)));
      const c0 = Math.max(0, Math.min(cols - 1, Math.round(startC)));
      const q = [[r0, c0]];
      distMap[r0][c0] = 0;
      let reachableCount = 0;
      const dirDefs = [
        { dr: -1, dc: 0, wall: 'top' },
        { dr: 0, dc: 1, wall: 'right' },
        { dr: 1, dc: 0, wall: 'bottom' },
        { dr: 0, dc: -1, wall: 'left' }
      ];
      while (q.length > 0) {
        const [cr, cc] = q.shift();
        reachableCount++;
        const cell = grid[cr][cc];
        for (const d of dirDefs) {
          if (!cell.walls[d.wall]) {
            const nr = cr + d.dr, nc = cc + d.dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid && distMap[nr][nc] === -1) {
              distMap[nr][nc] = distMap[cr][cc] + 1;
              parentMap[nr][nc] = [cr, cc];
              q.push([nr, nc]);
            }
          }
        }
      }
      return { distMap, parentMap, reachableCount };
    }

    function reconstructPath(parentMap, targetR, targetC) {
      const path = [];
      let curr = [targetR, targetC];
      while (curr) {
        path.push(curr);
        curr = parentMap[curr[0]][curr[1]];
      }
      return path.reverse();
    }

    function countOpenPassages(cell) {
      return (cell.walls.top ? 0 : 1) + (cell.walls.right ? 0 : 1) + (cell.walls.bottom ? 0 : 1) + (cell.walls.left ? 0 : 1);
    }

    function generateShapedMaze(levelSpec) {
      const { rows, cols, shapeId } = levelSpec;
      const { validMask, cells } = buildConnectedShapeMask(rows, cols, shapeId);
      const grid = Array.from({ length: rows }, (_, r) =>
        Array.from({ length: cols }, (_, c) => ({
          r, c, valid: validMask[r][c], visited: false,
          walls: { top: true, right: true, bottom: true, left: true }
        }))
      );
      if (cells.length === 0) return { grid, validCells: [] };

      const seed = cells[Math.floor(Math.random() * cells.length)];
      const dirDefs = [
        { dr: -1, dc: 0, wall: 'top', opp: 'bottom' },
        { dr: 0, dc: 1, wall: 'right', opp: 'left' },
        { dr: 1, dc: 0, wall: 'bottom', opp: 'top' },
        { dr: 0, dc: -1, wall: 'left', opp: 'right' }
      ];

      // 1. Recursive Backtracking Spanning Tree
      const stack = [seed];
      grid[seed[0]][seed[1]].visited = true;
      while (stack.length > 0) {
        const [cr, cc] = stack[stack.length - 1];
        const neighbors = [];
        for (const d of dirDefs) {
          const nr = cr + d.dr, nc = cc + d.dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid && !grid[nr][nc].visited) {
            neighbors.push({ nr, nc, d });
          }
        }
        if (neighbors.length > 0) {
          const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
          grid[cr][cc].walls[pick.d.wall] = false;
          grid[pick.nr][pick.nc].walls[pick.d.opp] = false;
          grid[pick.nr][pick.nc].visited = true;
          stack.push([pick.nr, pick.nc]);
        } else {
          stack.pop();
        }
      }

      // 2. 100% Dead-End Elimination (Zero One-Way Traps!)
      for (const [r, c] of cells) {
        const cell = grid[r][c];
        if (countOpenPassages(cell) <= 1) {
          const closed = [];
          for (const d of dirDefs) {
            if (cell.walls[d.wall]) {
              const nr = r + d.dr, nc = c + d.dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
                closed.push({ nr, nc, d, open: countOpenPassages(grid[nr][nc]) });
              }
            }
          }
          if (closed.length > 0) {
            closed.sort((a, b) => a.open - b.open);
            const pick = closed[0];
            cell.walls[pick.d.wall] = false;
            grid[pick.nr][pick.nc].walls[pick.d.opp] = false;
          }
        }
      }

      // 3. Tactical Braiding Loops (20% cross-passages for juking cats)
      for (const [r, c] of cells) {
        const cell = grid[r][c];
        if (countOpenPassages(cell) === 2 && Math.random() < 0.20) {
          const closed = [];
          for (const d of dirDefs) {
            if (cell.walls[d.wall]) {
              const nr = r + d.dr, nc = c + d.dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
                closed.push({ nr, nc, d });
              }
            }
          }
          if (closed.length > 0) {
            const pick = closed[Math.floor(Math.random() * closed.length)];
            cell.walls[pick.d.wall] = false;
            grid[pick.nr][pick.nc].walls[pick.d.opp] = false;
          }
        }
      }

      return { grid, validCells: cells };
    }

    function guaranteeSafeMultiExitSpawn(grid, startR, startC) {
      const rows = grid.length, cols = grid[0].length;
      const dirDefs = [
        { dr: -1, dc: 0, wall: 'top', opp: 'bottom' },
        { dr: 0, dc: 1, wall: 'right', opp: 'left' },
        { dr: 1, dc: 0, wall: 'bottom', opp: 'top' },
        { dr: 0, dc: -1, wall: 'left', opp: 'right' }
      ];
      const hub = [[startR, startC]];
      for (const d of dirDefs) {
        const nr = startR + d.dr, nc = startC + d.dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
          grid[startR][startC].walls[d.wall] = false;
          grid[nr][nc].walls[d.opp] = false;
          hub.push([nr, nc]);
        }
      }
      for (const [cr, cc] of hub) {
        for (const d of dirDefs) {
          if (countOpenPassages(grid[cr][cc]) >= 3) break;
          const nr = cr + d.dr, nc = cc + d.dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
            grid[cr][cc].walls[d.wall] = false;
            grid[nr][nc].walls[d.opp] = false;
          }
        }
      }
    }

      let diff = target - current;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

    // =========================================================================
    // 6. STATIC MAZE & MINIMAP OFFSCREEN CACHE (ARCHITECTURAL 3D BEVEL WALLS)
    // =========================================================================
    function rebuildStaticMazeCache() {
      const spec = LEVELS[gameState.currentLevelIdx];
      const { grid, mazeCache } = gameState;
      if (!grid.length) return;

      const rows = spec.rows, cols = spec.cols, cs = mazeCache.cellSize;
      const offCanvas = mazeCache.canvas;
      offCanvas.width = cols * cs;
      offCanvas.height = rows * cs;
      const octx = offCanvas.getContext('2d');
      octx.clearRect(0, 0, offCanvas.width, offCanvas.height);

      // 1. Handcrafted checkerboard tile floor + subtle inner tile highlight
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].valid) continue;
          const x = c * cs, y = r * cs;
          octx.fillStyle = (r + c) % 2 === 0 ? spec.floorColor : spec.floorAltColor;
          octx.fillRect(x, y, cs + 0.8, cs + 0.8);
          // Subtle recessed floor dot
          octx.fillStyle = 'rgba(255, 255, 255, 0.03)';
          octx.fillRect(x + 4, y + 4, cs - 8, cs - 8);
        }
      }

      const wallW = cs * 0.12;
      const strokeWalls = (sx, sy) => {
        octx.beginPath();
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = grid[r][c];
            if (!cell.valid) continue;
            const x = c * cs + sx, y = r * cs + sy;
            if (cell.walls.top) { octx.moveTo(x, y); octx.lineTo(x + cs, y); }
            if (cell.walls.right) { octx.moveTo(x + cs, y); octx.lineTo(x + cs, y + cs); }
            if (cell.walls.bottom) { octx.moveTo(x, y + cs); octx.lineTo(x + cs, y + cs); }
            if (cell.walls.left) { octx.moveTo(x, y); octx.lineTo(x, y + cs); }
          }
        }
        octx.stroke();
      };

      // Pass A: Ambient Floor Drop Shadow
      octx.save();
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
      octx.lineWidth = wallW * 1.55;
      strokeWalls(3.2, 4.2);
      octx.restore();

      // Pass B: 3D Extruded Side Bevel
      octx.save();
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.strokeStyle = spec.wallSideColor;
      octx.lineWidth = wallW * 1.25;
      strokeWalls(1.5, 2.0);
      octx.restore();

      // Pass C: Primary-to-Contrast Gradient Wall Body
      octx.save();
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      const grad = octx.createLinearGradient(0, 0, offCanvas.width, offCanvas.height);
      grad.addColorStop(0, spec.wallGradStart);
      grad.addColorStop(0.55, spec.wallGradMid);
      grad.addColorStop(1, spec.wallGradEnd);
      octx.strokeStyle = grad;
      octx.lineWidth = wallW;
      strokeWalls(0, 0);
      octx.restore();

      // Pass D: Crisp Specular Top Highlight
      octx.save();
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      octx.lineWidth = wallW * 0.28;
      strokeWalls(-0.6, -0.8);
      octx.restore();

      // Pre-render Minimap Silhouette
      const mapSize = 60;
      const miniCanvas = mazeCache.minimapCanvas;
      miniCanvas.width = mapSize;
      miniCanvas.height = mapSize;
      const mctx = miniCanvas.getContext('2d');
      mctx.clearRect(0, 0, mapSize, mapSize);
      mctx.fillStyle = 'rgba(10, 15, 30, 0.84)';
      mctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      mctx.lineWidth = 1.2;
      mctx.beginPath();
      mctx.roundRect(0, 0, mapSize, mapSize, 10);
      mctx.fill();
      mctx.stroke();

      const scale = (mapSize - 8) / Math.max(spec.cols, spec.rows);
      mctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      for (const [r, c] of gameState.validCells) {
        mctx.fillRect(4 + c * scale, 4 + r * scale, Math.max(1, scale), Math.max(1, scale));
      }

      mazeCache.dirty = false;
    }

    function updatePlayerBFS(force = false) {
      if (!gameState.grid.length) return;
      const pr = Math.round(gameState.player.r);
      const pc = Math.round(gameState.player.c);
      if (!force && pr === gameState.lastBFSPlayerCell.r && pc === gameState.lastBFSPlayerCell.c) return;
      gameState.lastBFSPlayerCell = { r: pr, c: pc };

      const { distMap, parentMap } = computeBFSReachability(gameState.grid, pr, pc);
      gameState.playerBFSMap = distMap;

      if (isGuideAllowedForCurrentLevel() && gameState.showBFSOverlay) {
        const paths = [];
        gameState.babies.forEach(b => {
          if (!b.rescued && distMap[b.r] && distMap[b.r][b.c] > 0) {
            paths.push({ type: 'baby', points: reconstructPath(parentMap, b.r, b.c) });
          }
        });
        if (distMap[gameState.exitCell.r] && distMap[gameState.exitCell.r][gameState.exitCell.c] > 0) {
          paths.push({ type: 'exit', points: reconstructPath(parentMap, gameState.exitCell.r, gameState.exitCell.c) });
        }
        gameState.bfsPathsToTargets = paths;
      } else {
        gameState.bfsPathsToTargets = [];
      }
    }

    // =========================================================================
    // 7. LEVEL LOADING & SEQUENTIAL PROGRESSION
    // =========================================================================
    function loadLevel(idx, autoStart = false, resetLivesToThree = true) {
      gameState.currentLevelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
      if (resetLivesToThree) gameState.lives = 3;
      gameState.hasActiveSession = autoStart;
      gameState.deathAnim.active = false;
      gameState.celebration.active = false;
      gameState.showBFSOverlay = false;
      gameState.bfsPathsToTargets = [];
      gameState.lastBFSPlayerCell = { r: -1, c: -1 };
      gameState.fxParticles = [];
      gameState.floatingTexts = [];
      gameState.virtualStick.active = false;

      sound.setTension(0);
      document.getElementById('tension-vignette').style.opacity = '0';
      gameState.lastVignetteOpacity = 0;

      const spec = LEVELS[gameState.currentLevelIdx];
      const { grid, validCells } = generateShapedMaze(spec);
      gameState.grid = grid;
      gameState.validCells = validCells;

      // Pick interior multi-exit start cell
      const sorted = [...validCells].sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
      let startPos = sorted[Math.min(Math.floor(sorted.length * 0.08), sorted.length - 1)] || sorted[0];
      for (let i = 0; i < Math.min(35, sorted.length); i++) {
        const [cr, cc] = sorted[i];
        if (countOpenPassages(grid[cr][cc]) >= 3) { startPos = [cr, cc]; break; }
      }
      guaranteeSafeMultiExitSpawn(grid, startPos[0], startPos[1]);

      const { distMap } = computeBFSReachability(grid, startPos[0], startPos[1]);
      gameState.playerBFSMap = distMap;

      let exitPos = sorted[sorted.length - 1];
      let maxBfsDist = -1;
      for (const [r, c] of validCells) {
        if (distMap[r][c] > maxBfsDist) { maxBfsDist = distMap[r][c]; exitPos = [r, c]; }
      }

      gameState.player = {
        r: startPos[0], c: startPos[1],
        fromR: startPos[0], fromC: startPos[1],
        targetR: startPos[0], targetC: startPos[1],
        moveDir: { dr: 0, dc: 0 },
        heldDir: null,
        bufferedDir: null,
        bufferedAt: 0,
        angle: 0,
        visualAngle: 0,
        walkPhase: 0
      };
      gameState.camera.r = startPos[0];
      gameState.camera.c = startPos[1];

      gameState.exitCell = { r: exitPos[0], c: exitPos[1], unlocked: false };
      gameState.rescuedTrail = [{ r: startPos[0], c: startPos[1], angle: 0 }];

      // Place Baby Mice distributed across the maze
      const occupied = new Set([`${startPos[0]},${startPos[1]}`, `${exitPos[0]},${exitPos[1]}`]);
      const babyPool = validCells.filter(([r, c]) => distMap[r][c] >= 5 && !occupied.has(`${r},${c}`));
      shuffleArray(babyPool);

      gameState.babies = [];
      for (let i = 0; i < spec.babies && i < babyPool.length; i++) {
        const [br, bc] = babyPool[i];
        occupied.add(`${br},${bc}`);
        gameState.babies.push({ id: i, r: br, c: bc, rescued: false, bobPhase: Math.random() * Math.PI * 2 });
      }

      // Place Cats far from startPos and spread apart
      const farCatPool = validCells
        .filter(([r, c]) => distMap[r][c] >= 10 && Math.hypot(r - startPos[0], c - startPos[1]) >= 8 && !occupied.has(`${r},${c}`))
        .sort((a, b) => distMap[b[0]][b[1]] - distMap[a[0]][a[1]]);
      const fallbackPool = validCells
        .filter(([r, c]) => !occupied.has(`${r},${c}`))
        .sort((a, b) => distMap[b[0]][b[1]] - distMap[a[0]][a[1]]);
      const pool = farCatPool.length >= spec.cats ? farCatPool : fallbackPool;

      const catPalettes = [
        { body: '#475569', stripe: '#1e293b', earInner: '#fda4af' },
        { body: '#ea580c', stripe: '#9a3412', earInner: '#fed7aa' },
        { body: '#334155', stripe: '#0f172a', earInner: '#f43f5e' },
        { body: '#9333ea', stripe: '#581c87', earInner: '#f5d0fe' }
      ];

      gameState.cats = [];
      const chosenCats = [];
      for (let i = 0; i < spec.cats; i++) {
        let pick = pool[i % Math.max(1, pool.length)] || exitPos;
        for (const cand of pool) {
          if (chosenCats.every(prev => Math.hypot(cand[0] - prev[0], cand[1] - prev[1]) >= 5)) {
            pick = cand;
            break;
          }
        }
        chosenCats.push(pick);
        gameState.cats.push({
          id: i, r: pick[0], c: pick[1], targetR: pick[0], targetC: pick[1],
          lastR: pick[0], lastC: pick[1], angle: 0, visualAngle: 0,
          stridePhase: Math.random() * Math.PI * 2,
          alerted: false,
          palette: catPalettes[i % catPalettes.length]
        });
      }

      rebuildStaticMazeCache();
      updateFullLevelUI();

      if (autoStart) {
        startGameplay(true);
      } else {
        stopLoops();
        renderMazeFrame();
      }
    }

    function handleSeamlessLevelClear() {
      const spec = LEVELS[gameState.currentLevelIdx];
      gameState.continuesLeft[gameState.currentLevelIdx] = 10;
      if (gameState.score > gameState.bestScore) {
        gameState.bestScore = gameState.score;
        saveBestScore(gameState.bestScore);
      }

      if (spec.level === LEVELS.length) {
        triggerAllClearFirecrackerCelebration();
        return;
      }

      const nextIdx = gameState.currentLevelIdx + 1;
      showToast(`🎉 過關！進入第 ${nextIdx + 1} 關`, 'bg-emerald-300 text-slate-950');
      loadLevel(nextIdx, true, true);
    }

    function handleOutOfThreeLivesSeamless() {
      const idx = gameState.currentLevelIdx;
      if (gameState.continuesLeft[idx] > 0) {
        gameState.continuesLeft[idx]--;
        const leftAfter = gameState.continuesLeft[idx];
        loadLevel(idx, true, true);
        showToast(`🔄 續關 (剩 ${leftAfter}/10 次)`, 'bg-amber-300 text-slate-950');
      } else {
        gameState.continuesLeft.fill(10);
        gameState.score = 0;
        loadLevel(0, true, true);
        showToast(`💀 10次續關用盡，重回第 1 關`, 'bg-rose-500 text-white');
      }
    }

    // =========================================================================

    function spawnFirecrackerBurst(x, y, count = 34, isBig = false) {
      const c = gameState.celebration;
      const palettes = [
        ['#ef4444', '#facc15', '#fde047', '#ffffff'],
        ['#fb7185', '#f59e0b', '#fef08a', '#ffffff'],
        ['#22d3ee', '#38bdf8', '#fde047', '#ffffff'],
        ['#34d399', '#aeea00', '#fef08a', '#ffffff']
      ];
      const pal = palettes[Math.floor(Math.random() * palettes.length)];

      c.shockwaves.push({
        x, y, r: isBig ? 8 : 4, maxR: isBig ? 95 : 46,
        alpha: isBig ? 0.9 : 0.65, color: isBig ? '#fde047' : '#fb923c'
      });

      if (isBig) {
        c.shake = Math.min(9, c.shake + 5.5);
        c.flashAlpha = Math.min(0.45, c.flashAlpha + 0.28);
      } else {
        c.shake = Math.min(5, c.shake + 1.8);
      }

      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
        const speed = (isBig ? 130 : 75) + Math.random() * (isBig ? 190 : 110);
        c.particles.push({
          x, y, prevX: x, prevY: y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - (isBig ? 25 : 10),
          life: (isBig ? 0.75 : 0.42) + Math.random() * 0.45,
          maxLife: isBig ? 1.15 : 0.8,
          size: (isBig ? 3.2 : 2.0) + Math.random() * 2.2,
          color: pal[Math.floor(Math.random() * pal.length)]
        });
      }

      const scrapCount = isBig ? 18 : 8;
      for (let i = 0; i < scrapCount; i++) {
        c.confetti.push({
          x: x + (Math.random() - 0.5) * 26,
          y: y + (Math.random() - 0.5) * 16,
          vx: (Math.random() - 0.5) * 110,
          vy: -55 - Math.random() * 85,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 11,
          flip: Math.random() * Math.PI * 2,
          vFlip: 7 + Math.random() * 8,
          w: 7 + Math.random() * 5,
          h: 3.5 + Math.random() * 3,
          color: Math.random() < 0.6 ? '#ef4444' : '#facc15',
          life: 2.6 + Math.random() * 1.4
        });
      }
    }

    function updateFirecrackerCelebration(dt, now) {
      const c = gameState.celebration;
      const { width, height } = gameState.canvasSize;
      c.shake = Math.max(0, c.shake - 18 * dt);
      c.flashAlpha = Math.max(0, c.flashAlpha - 1.4 * dt);

      c.strings.forEach(str => {
        if (str.popped < str.count && now >= str.nextPopAt) {
          const idxFromBottom = str.count - 1 - str.popped;
          const sway = Math.sin(now * 0.005 + str.swayPhase) * 4;
          const fy = str.topY + 26 + idxFromBottom * 13;
          const fx = str.x + sway + (idxFromBottom % 2 === 0 ? -8 : 8);
          spawnFirecrackerBurst(fx, fy, 22, false);
          sound.playFirecrackerPop(0, 0.22);
          str.popped++;
          str.nextPopAt = now + 85;
        }
      });

      if (now - c.lastVolleyTime > 2200) {
        c.lastVolleyTime = now;
        launchFireworkRocket(width * (0.25 + Math.random() * 0.2), height * (0.16 + Math.random() * 0.16));
        launchFireworkRocket(width * (0.55 + Math.random() * 0.2), height * (0.16 + Math.random() * 0.16));
        c.strings.forEach(str => { str.popped = 0; str.nextPopAt = now + 90; });
      }

      for (let i = c.rockets.length - 1; i >= 0; i--) {
        const rk = c.rockets[i];
        rk.prevX = rk.x; rk.prevY = rk.y;
        rk.x += rk.vx * dt; rk.y += rk.vy * dt; rk.vy += 120 * dt;
        if (rk.y <= rk.targetY || rk.vy >= -40) {
          spawnFirecrackerBurst(rk.x, rk.y, 48, true);
          sound.playBigFireworkBoom(0);
          c.rockets.splice(i, 1);
        }
      }

      for (let i = c.shockwaves.length - 1; i >= 0; i--) {
        const sw = c.shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 9 * dt + 30 * dt;
        sw.alpha -= 1.8 * dt;
        if (sw.alpha <= 0) c.shockwaves.splice(i, 1);
      }

      for (let i = c.particles.length - 1; i >= 0; i--) {
        const pt = c.particles[i];
        pt.prevX = pt.x; pt.prevY = pt.y;
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vx *= Math.pow(0.28, dt); pt.vy += 220 * dt;
        pt.life -= dt;
        if (pt.life <= 0) c.particles.splice(i, 1);
      }

      for (let i = c.confetti.length - 1; i >= 0; i--) {
        const cf = c.confetti[i];
        cf.x += cf.vx * dt + Math.sin(now * 0.007 + i) * 24 * dt;
        cf.y += cf.vy * dt; cf.vy += 110 * dt;
        cf.rot += cf.vRot * dt; cf.flip += cf.vFlip * dt;
        cf.life -= dt;
        if (cf.life <= 0 || cf.y > height + 20) c.confetti.splice(i, 1);
      }
    }

    function drawFirecrackerCelebration(ctx) {
      const c = gameState.celebration;
      if (!c.active) return;
      const { width, height } = gameState.canvasSize;
      const now = performance.now();

      ctx.save();
      if (c.shake > 0.2) {
        ctx.translate((Math.random() - 0.5) * c.shake * 2, (Math.random() - 0.5) * c.shake * 2);
      }
      if (c.flashAlpha > 0.01) {
        ctx.fillStyle = `rgba(253, 224, 71, ${c.flashAlpha})`;
        ctx.fillRect(0, 0, width, height);
      }

      c.shockwaves.forEach(sw => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      c.rockets.forEach(rk => {
        ctx.save();
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rk.prevX, rk.prevY + 14);
        ctx.lineTo(rk.x, rk.y);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(rk.x, rk.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      c.strings.forEach(str => {
        const sway = Math.sin(now * 0.005 + str.swayPhase) * 4;
        const remaining = str.count - str.popped;
        ctx.save();
        ctx.fillStyle = '#b91c1c';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(str.x + sway * 0.3, str.topY, 13, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(str.x + sway * 0.3, str.topY + 9);
        ctx.lineTo(str.x + sway, str.topY + 26 + Math.max(0, remaining - 1) * 13);
        ctx.stroke();

        for (let i = 0; i < remaining; i++) {
          const fx = str.x + sway + (i % 2 === 0 ? -8 : 8);
          const fy = str.topY + 26 + i * 13;
          ctx.save();
          ctx.translate(fx, fy);
          ctx.rotate(i % 2 === 0 ? -0.48 : 0.48);
          ctx.fillStyle = '#dc2626';
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 1.2;
          ctx.fillRect(-5, -9, 10, 18);
          ctx.strokeRect(-5, -9, 10, 18);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-5, -2.5, 10, 4);
          ctx.restore();
        }
        ctx.restore();
      });

      c.confetti.forEach(cf => {
        ctx.save();
        ctx.translate(cf.x, cf.y);
        ctx.rotate(cf.rot);
        ctx.scale(Math.cos(cf.flip), 1);
        ctx.fillStyle = cf.color;
        ctx.fillRect(-cf.w / 2, -cf.h / 2, cf.w, cf.h);
        ctx.restore();
      });

      c.particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, pt.life / pt.maxLife));
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = pt.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pt.prevX, pt.prevY);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();
    }

    // =========================================================================

    function startGameplay(grantSpawnShield = true) {
      hideOverlay();

      homeScreen.classList.add('hidden');
      homeScreen.classList.remove('flex');

      if (grantSpawnShield) {
        gameState.shieldUntil = Date.now() + 3000;
      }
      gameState.lastFrameTime = performance.now();
      document.getElementById('pause-icon').textContent = '⏸️';

      stopLoops();
      if (sound.ctx) sound.startChaseBGM();

      const frameLoop = (now) => {
        const dt = Math.min(0.035, Math.max(0.001, (now - gameState.lastFrameTime) / 1000));
        gameState.lastFrameTime = now;

        if (gameState.status === 'playing') {
          updateSmoothEntities(dt);
        } else if (gameState.status === 'dying_heaven') {
          updateDeathHeavenAnimation(now);
        }

        renderMazeFrame();

        if (gameState.status === 'playing' || gameState.status === 'dying_heaven') {
          gameState.animFrame = requestAnimationFrame(frameLoop);
        }
      };
      gameState.animFrame = requestAnimationFrame(frameLoop);

    function stopLoops() {
      if (gameState.animFrame) {
        cancelAnimationFrame(gameState.animFrame);

      }

    function togglePause() {

        gameState.status = 'paused';

      }
