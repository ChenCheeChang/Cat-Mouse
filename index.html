<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>貓抓老鼠 3D — 迷宮救援</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-drag: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    html, body {
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      touch-action: none !important;
      position: fixed;
      inset: 0;
    }
    ::selection { background: transparent !important; color: inherit !important; }
    .ios-glass {
      background: rgba(15, 23, 42, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
    }
    .ios-shell {
      background: rgba(10, 15, 30, 0.90);
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.48);
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      transition: background 0.06s ease, transform 0.06s ease;
    }
    .dpad-btn-active {
      background: rgba(250, 204, 21, 0.92) !important;
      color: #0f172a !important;
      border-color: #ffffff !important;
      transform: scale(0.92);
    }
    #tension-vignette {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease-out;
      box-shadow: inset 0 0 65px rgba(239, 68, 68, 0.92);
    }
    #cartoon-popup {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
    }
    input[type="range"] {
      touch-action: pan-x !important;
      accent-color: #facc15;
    }
  </style>
</head>
<body id="app-body" class="w-full h-full overflow-hidden text-white flex flex-col items-center justify-between p-1.5 sm:p-2.5 select-none" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

  <!-- Minimalist Game Options Home Screen -->
  <div id="home-menu-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950/94 backdrop-blur-md">
    <div class="w-full max-w-sm rounded-[2rem] ios-shell p-5 sm:p-6 flex flex-col items-center text-center gap-4 border-2 border-white/25">
      <div class="flex items-center justify-center gap-3">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-300 via-orange-400 to-rose-500 flex items-center justify-center text-4xl shadow-lg border-2 border-white/50">🐭</div>
        <div class="text-2xl font-black text-amber-300">3D</div>
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-slate-500 via-slate-600 to-slate-800 flex items-center justify-center text-4xl shadow-lg border-2 border-white/30">🐱</div>
      </div>

      <div>
        <h1 class="text-3xl font-black tracking-tight text-white">貓抓老鼠 3D</h1>
      </div>

      <div class="w-full flex flex-col gap-2.5 text-left">
        <div class="w-full px-4 py-2.5 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-between text-xs font-bold">
          <span class="text-white/75">目前關卡</span>
          <span id="home-level-label" class="text-amber-300 font-black">第 1 / 20 關 · 正方形</span>
        </div>

        <div class="w-full px-4 py-2.5 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-between text-xs font-bold">
          <span class="text-white/75">最高分數</span>
          <span id="home-best-score" class="text-emerald-300 font-black">0</span>
        </div>

        <div class="w-full px-4 py-3 rounded-2xl bg-white/10 border border-white/15 flex flex-col gap-1.5">
          <div class="flex items-center justify-between text-xs font-bold">
            <span class="text-white/80">3D 視野範圍</span>
            <span id="home-cam-label" class="text-cyan-300 font-black">9×9</span>
          </div>
          <input id="home-slider-cam" type="range" min="8" max="14" value="9" class="w-full h-2 cursor-pointer" />
        </div>

        <button id="btn-HomeToggleAudio" type="button" class="w-full px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 flex items-center justify-between text-xs font-bold active:opacity-80">
          <span class="text-white/80">遊戲音效</span>
          <span class="flex items-center gap-1.5 font-black text-amber-300">
            <span id="home-audio-icon">🔊</span>
            <span id="home-audio-text">開啟</span>
          </span>
        </button>
      </div>

      <button id="btn-StartFromHome" type="button" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-300 via-yellow-400 to-orange-400 text-slate-950 font-black text-lg shadow-xl border-2 border-white/60 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
        <span>▶️</span>
        <span id="btn-StartFromHome-text">開始遊戲</span>
      </button>
    </div>
  </div>

  <!-- Compact Top Navigation -->
  <header class="w-full max-w-md flex items-center justify-between gap-2 shrink-0 px-1 pt-0.5">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-9 h-9 rounded-xl ios-glass flex items-center justify-center text-xl shadow shrink-0">🐭</div>
      <div class="min-w-0 leading-tight">
        <div class="flex items-center gap-1.5">
          <span class="text-sm sm:text-base font-black tracking-tight text-white truncate">貓抓老鼠 3D</span>
          <span id="theme-badge" class="text-[10px] font-black px-1.5 py-0.5 rounded-full bg-white/20 text-white shrink-0">橘系</span>
        </div>
        <div id="level-subtitle" class="text-[11px] text-white/85 font-bold mt-0.5 truncate">第 1 / 20 關 · 正方形</div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-ReturnHome" type="button" class="ios-glass hover:bg-white/20 px-2.5 h-8 rounded-full flex items-center justify-center gap-1 text-xs font-bold active:opacity-80" title="首頁">
        <span>🏠</span>
      </button>
      <button id="btn-ToggleBGM" type="button" class="ios-glass hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-sm active:opacity-80" title="音效">
        <span id="bgm-icon">🔊</span>
      </button>
      <button id="btn-Pause" type="button" class="ios-glass hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-xs font-black active:opacity-80" title="暫停">
        <span id="pause-icon">⏸</span>
      </button>
    </div>
  </header>

  <!-- Main Fullscreen iPhone 3D Stage -->
  <main class="w-full max-w-md flex-1 min-h-0 flex flex-col justify-between my-1">
    <section class="w-full h-full flex-1 min-h-0 ios-shell rounded-[1.8rem] p-2 sm:p-2.5 flex flex-col items-center justify-between gap-1.5 relative overflow-hidden">

      <!-- Dynamic Island Status Pill -->
      <div class="w-full flex items-center justify-center shrink-0">
        <div class="bg-black/95 px-3 py-1 rounded-full flex items-center gap-2 border border-white/15">
          <div id="danger-led" class="w-2 h-2 rounded-full bg-emerald-400"></div>
          <span id="island-status" class="text-[10px] font-black tracking-wide text-white/95">3D 迷宮進行中</span>
        </div>
      </div>

      <!-- Compact Mission & HUD Counters -->
      <div class="w-full shrink-0 flex flex-col gap-1">
        <div id="mission-banner" class="w-full px-3 py-1 rounded-xl bg-white/12 border border-white/15 flex items-center justify-between text-[11px] font-bold">
          <span id="mission-text" class="truncate">尋找 2 隻小老鼠</span>
          <span id="shape-pill" class="px-2 py-0.5 rounded-full bg-black/40 text-amber-300 text-[10px] font-black shrink-0 ml-2">正方形</span>
        </div>

        <div class="w-full grid grid-cols-4 gap-1 text-center">
          <div class="bg-white/10 rounded-xl py-1 px-1 border border-white/10">
            <div class="text-[9px] text-white/60 font-bold">生命</div>
            <div id="hud-lives" class="text-[11px] font-black text-rose-300 leading-tight">❤️❤️❤️</div>
          </div>
          <div class="bg-white/10 rounded-xl py-1 px-1 border border-white/10">
            <div class="text-[9px] text-white/60 font-bold">救援</div>
            <div id="hud-babies" class="text-[11px] font-black text-amber-300 leading-tight">0 / 2</div>
          </div>
          <div class="bg-white/10 rounded-xl py-1 px-1 border border-white/10">
            <div class="text-[9px] text-white/60 font-bold">續關·貓</div>
            <div id="hud-cats" class="text-[11px] font-black text-cyan-300 leading-tight">🔄10·🐱2</div>
          </div>
          <div class="bg-white/10 rounded-xl py-1 px-1 border border-white/10">
            <div class="text-[9px] text-white/60 font-bold">分數</div>
            <div id="hud-score" class="text-[11px] font-black text-emerald-300 leading-tight">0</div>
          </div>
        </div>
      </div>

      <!-- 3D WebGL Maze Viewport + 2D Minimap/Firecrackers Overlay Canvas -->
      <div id="canvas-wrapper" class="relative w-full flex-1 min-h-0 rounded-2xl overflow-hidden border-2 border-white/25 bg-slate-950 shadow-inner touch-none">
        <canvas id="webgl-canvas" class="w-full h-full block touch-none"></canvas>
        <canvas id="fx-canvas" class="absolute inset-0 w-full h-full block pointer-events-none"></canvas>

        <!-- Minimal Toast -->
        <div id="cartoon-popup" class="pointer-events-none absolute top-2.5 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-amber-400 text-slate-950 font-black text-xs shadow-lg opacity-0 scale-75 whitespace-nowrap z-20">
          救援成功
        </div>

        <!-- Proximity Red Tension Vignette -->
        <div id="tension-vignette" class="absolute inset-0 z-10 rounded-2xl"></div>

        <!-- Pause / Victory Overlay -->
        <div id="canvas-overlay" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center p-4 text-center bg-slate-950/65 backdrop-blur-[2px]">
          <div id="overlay-emoji" class="text-5xl mb-2">🎉</div>
          <h2 id="overlay-title" class="text-2xl font-black text-white mb-1 drop-shadow">全關卡破關！</h2>
          <p id="overlay-desc" class="text-xs sm:text-sm text-white/90 font-semibold mb-4 max-w-[260px] leading-relaxed drop-shadow"></p>
          <div class="flex flex-col gap-2 w-full max-w-[220px]">
            <button id="btn-OverlayPrimary" type="button" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-amber-300 to-orange-400 text-slate-950 font-black text-sm shadow-lg active:opacity-85">
              重新開始
            </button>
            <button id="btn-OverlaySecondary" type="button" class="hidden w-full py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white font-bold text-xs border border-white/20">
              返回選項首頁
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Ergonomic Controller Bar (Left: Restart/Guide | RIGHT: 4-Way D-Pad — NO DASH) -->
      <div class="w-full shrink-0 flex items-center justify-between gap-2 px-1 touch-none">

        <!-- Left: Clean Utility Controls (Restart & Levels 1-3 Guide Toggle) -->
        <div class="flex flex-col items-stretch justify-center gap-2 min-w-[116px]">
          <button id="btn-Restart" type="button" class="ios-glass hover:bg-white/20 px-3.5 py-2.5 rounded-2xl flex items-center justify-center font-bold text-xs gap-1.5 shadow w-full active:opacity-80">
            <span>🔄</span><span>重設本關</span>
          </button>
          <button id="btn-ToggleBFS" type="button" class="ios-glass hover:bg-white/20 px-3.5 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow w-full justify-center active:opacity-80">
            <span>🧭</span>
            <span id="bfs-toggle-text">引導: 關</span>
          </button>
        </div>

        <!-- RIGHT: Strict 4-Way Cardinal D-Pad for Right-Hand Thumb -->
        <div id="dpad-pad" class="relative grid grid-cols-3 gap-1 w-32 h-28 sm:w-36 sm:h-28 touch-none select-none p-1 rounded-2xl bg-slate-900/95 border border-white/25 shadow-inner shrink-0">
          <div></div>
          <button id="dpad-up" data-dir="U" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▲</button>
          <div></div>
          <button id="dpad-left" data-dir="L" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">◀</button>
          <div class="rounded-full bg-white/10 border border-white/20 flex items-center justify-center pointer-events-none">
            <div id="dpad-nub" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-amber-400 shadow transition-transform duration-75"></div>
          </div>
          <button id="dpad-right" data-dir="R" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▶</button>
          <div></div>
          <button id="dpad-down" data-dir="D" type="button" class="dpad-btn rounded-xl flex items-center justify-center text-base sm:text-lg font-black pointer-events-none">▼</button>
          <div></div>
        </div>

      </div>
    </section>
  </main>

    window.addEventListener('selectstart', (e) => e.preventDefault(), { passive: false });

    window.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

      if (e.target.type !== 'range') e.preventDefault();

      playStepPluck(stepCount) {

      startChaseBGM() {

        const calmBass = [130.81, 196.00, 146.83, 196.00, 164.81, 196.00, 146.83, 196.00];
        const calmMelody = [523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 698.46];

          if (!this.bgmEnabled || !this.ctx || gameState.status !== 'playing') return;
          const now = this.ctx.currentTime;

          const isPanic = t > 0.3;
          const bassFreq = isPanic ? panicBass[idx] * (1 + t * 0.16) : calmBass[idx];
          const melFreq = isPanic ? panicMelody[idx] : calmMelody[idx];

          const bassOsc = this.ctx.createOscillator();
          const bassGain = this.ctx.createGain();
          bassOsc.type = isPanic ? 'sawtooth' : 'triangle';
          bassOsc.frequency.setValueAtTime(bassFreq, now);
          bassGain.gain.setValueAtTime(isPanic ? 0.068 : 0.042, now);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + (isPanic ? 0.08 : 0.12));
          bassOsc.connect(bassGain);
          bassGain.connect(this.ctx.destination);
          bassOsc.start(now);
          bassOsc.stop(now + (isPanic ? 0.085 : 0.13));

          if (isPanic || idx % 2 === 0 || idx === 7) {
            const melOsc = this.ctx.createOscillator();
            const melGain = this.ctx.createGain();
            melOsc.type = isPanic ? 'square' : 'sine';
            melOsc.frequency.setValueAtTime(melFreq, now + 0.035);
            melGain.gain.setValueAtTime(isPanic ? 0.042 : 0.028, now + 0.035);
            melGain.gain.exponentialRampToValueAtTime(0.001, now + (isPanic ? 0.095 : 0.15));
            melOsc.connect(melGain);
            melGain.connect(this.ctx.destination);
            melOsc.start(now + 0.035);
            melOsc.stop(now + (isPanic ? 0.1 : 0.16));
          }

          const nextDelay = Math.round(235 - t * 145);
          this.bgmTimeout = setTimeout(tickNote, Math.max(85, nextDelay));
        };
        tickNote();
      }

      stopChaseBGM() {
        if (this.bgmTimeout) {
          clearTimeout(this.bgmTimeout);
          this.bgmTimeout = null;
        }
      }
    }

    const sound = new CartoonAudioEngine();

    // =========================================================================
    // 3. ZERO-DEAD-END BRAIDED MAZE ENGINE (20 SHAPES, 100% CONNECTED)
    // =========================================================================
    function isCellInsideShape(r, c, rows, cols, shapeId) {
      const ny = ((r + 0.5) / rows) * 2 - 1;
      const nx = ((c + 0.5) / cols) * 2 - 1;
      switch (shapeId) {
        case 'square': return true;
        case 'rectangle': return Math.abs(ny) <= 0.72;
        case 'triangle': {
          const py = (r + 0.5) / rows;
          if (py < 0.06 || py > 0.96) return false;
          return Math.abs(nx) <= (0.14 + py * 0.82);
        }
        case 'circle': return (nx * nx + ny * ny) <= 0.92;
        case 'diamond': return (Math.abs(nx) + Math.abs(ny)) <= 1.22;
        case 'ellipse': return ((nx * nx) / (0.98 * 0.98) + (ny * ny) / (0.68 * 0.68)) <= 1.0;
        case 'hexagon': return Math.abs(ny) <= 0.9 && (Math.abs(nx) * 0.86 + Math.abs(ny) * 0.5) <= 0.92;
        case 'star': {
          const angle = Math.atan2(ny, nx);
          const dist = Math.sqrt(nx * nx + ny * ny);
          return dist <= (0.68 + 0.26 * Math.cos(5 * (angle + Math.PI / 2)));
        }
        case 'heart': {
          const x = nx * 1.18;
          const y = -ny * 1.15 + 0.15;
          return (Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3)) <= 0.08;
        }
        case 'hourglass': return Math.abs(nx) <= (0.34 + 0.64 * Math.abs(ny)) && Math.abs(ny) <= 0.95;
        case 'cross': return (Math.abs(nx) <= 0.42 && Math.abs(ny) <= 0.95) || (Math.abs(ny) <= 0.42 && Math.abs(nx) <= 0.95);
        case 'ring': {
          const r2 = nx * nx + ny * ny;
          return r2 <= 0.92 && r2 >= 0.13;
        }
        case 'octagon': return Math.abs(nx) <= 0.92 && Math.abs(ny) <= 0.92 && (Math.abs(nx) + Math.abs(ny)) <= 1.38;
        case 'crescent': {
          const outer = (nx * nx + ny * ny) <= 0.94;
          const innerCut = ((nx - 0.52) * (nx - 0.52) + ny * ny) >= 0.40;
          return outer && innerCut;
        }
        case 'clover': {
          const p1 = (nx - 0.40) ** 2 + (ny - 0.40) ** 2 <= 0.29;
          const p2 = (nx + 0.40) ** 2 + (ny - 0.40) ** 2 <= 0.29;
          const p3 = (nx - 0.40) ** 2 + (ny + 0.40) ** 2 <= 0.29;
          const p4 = (nx + 0.40) ** 2 + (ny + 0.40) ** 2 <= 0.29;
          const core = (nx * nx + ny * ny) <= 0.22;
          return p1 || p2 || p3 || p4 || core;
        }
        case 'shield': {
          if (ny < -0.88 || ny > 0.94) return false;
          if (ny <= 0.05) return Math.abs(nx) <= 0.86;
          const t = (ny - 0.05) / 0.89;
          return Math.abs(nx) <= 0.86 * (1 - t * t * 0.88);
        }
        case 'butterfly': {
          const body = Math.abs(nx) <= 0.26 && Math.abs(ny) <= 0.72;
          const upperL = ((nx + 0.50) / 0.46) ** 2 + ((ny + 0.34) / 0.46) ** 2 <= 1.0;
          const upperR = ((nx - 0.50) / 0.46) ** 2 + ((ny + 0.34) / 0.46) ** 2 <= 1.0;
          const lowerL = ((nx + 0.44) / 0.40) ** 2 + ((ny - 0.36) / 0.42) ** 2 <= 1.0;
          const lowerR = ((nx - 0.44) / 0.40) ** 2 + ((ny - 0.36) / 0.42) ** 2 <= 1.0;
          return body || upperL || upperR || lowerL || lowerR;
        }
        case 'castle': {
          if (ny > 0.92 || ny < -0.92 || Math.abs(nx) > 0.90) return false;
          if (ny >= -0.38) return true;
          return Math.abs(nx) >= 0.46 || Math.abs(nx) <= 0.24;
        }
        case 'crown': {
          if (ny > 0.88 || ny < -0.88 || Math.abs(nx) > 0.92) return false;
          if (ny >= 0.05) return Math.abs(nx) <= (0.88 - (ny - 0.05) * 0.14);
          const peakCenter = Math.abs(nx) <= 0.26 * (1 - (-ny) * 0.45);
          const peakLeft = nx <= -0.34 && nx >= -0.90 && ny >= -0.78 + Math.abs(nx + 0.62) * 1.4;
          const peakRight = nx >= 0.34 && nx <= 0.90 && ny >= -0.78 + Math.abs(nx - 0.62) * 1.4;
          const band = ny >= -0.22 && Math.abs(nx) <= 0.88;
          return peakCenter || peakLeft || peakRight || band;
        }
        case 'grand_star': {
          const angle = Math.atan2(ny, nx);
          const dist = Math.sqrt(nx * nx + ny * ny);
          return dist <= (0.76 + 0.19 * Math.cos(8 * angle));
        }
        default: return true;
      }
    }

    function buildConnectedShapeMask(rows, cols, shapeId) {
      const raw = Array.from({ length: rows }, (_, r) =>
        Array.from({ length: cols }, (_, c) => isCellInsideShape(r, c, rows, cols, shapeId))
      );
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let changed = true;
      while (changed) {
        changed = false;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (!raw[r][c]) continue;
            let cnt = 0;
            for (const [dr, dc] of dirs) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && raw[nr][nc]) cnt++;
            }
            if (cnt < 2) {
              raw[r][c] = false;
              changed = true;
            }
          }
        }
      }

      const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
      let bestComp = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!raw[r][c] || visited[r][c]) continue;
          const comp = [];
          const q = [[r, c]];
          visited[r][c] = true;
          while (q.length) {
            const [cr, cc] = q.shift();
            comp.push([cr, cc]);
            for (const [dr, dc] of dirs) {
              const nr = cr + dr, nc = cc + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && raw[nr][nc] && !visited[nr][nc]) {
                visited[nr][nc] = true;
                q.push([nr, nc]);
              }
            }
          }
          if (comp.length > bestComp.length) bestComp = comp;
        }
      }

      const mask = Array.from({ length: rows }, () => Array(cols).fill(false));
      for (const [r, c] of bestComp) mask[r][c] = true;
      return { mask, validCells: bestComp };
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function computeBFSReachability(grid, startR, startC) {
      const rows = grid.length;
      const cols = grid[0].length;
      const distMap = Array.from({ length: rows }, () => Array(cols).fill(-1));
      const parentMap = Array.from({ length: rows }, () => Array(cols).fill(null));
      if (!grid[startR] || !grid[startR][startC] || !grid[startR][startC].valid) {
        return { distMap, parentMap };
      }
      const q = [[startR, startC]];
      distMap[startR][startC] = 0;
      const dirs = [
        { dr: -1, dc: 0, w: 'top' },
        { dr: 0, dc: 1, w: 'right' },
        { dr: 1, dc: 0, w: 'bottom' },
        { dr: 0, dc: -1, w: 'left' }
      ];
      let head = 0;
      while (head < q.length) {
        const [r, c] = q[head++];
        const cell = grid[r][c];
        for (const d of dirs) {
          if (cell.walls[d.w]) continue;
          const nr = r + d.dr, nc = c + d.dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid && distMap[nr][nc] === -1) {
            distMap[nr][nc] = distMap[r][c] + 1;
            parentMap[nr][nc] = [r, c];
            q.push([nr, nc]);
          }
        }
      }
      return { distMap, parentMap };
    }

    function reconstructPath(parentMap, startR, startC, endR, endC) {
      const path = [];
      let curr = [endR, endC];
      let guard = 0;
      while (curr && guard < 4000) {
        path.push(curr);
        if (curr[0] === startR && curr[1] === startC) break;
        curr = parentMap[curr[0]] && parentMap[curr[0]][curr[1]];
        guard++;
      }
      return path.reverse();
    }

    function countOpenPassages(cell) {
      return (cell.walls.top ? 0 : 1) + (cell.walls.right ? 0 : 1) + (cell.walls.bottom ? 0 : 1) + (cell.walls.left ? 0 : 1);
    }

    function generateShapedMaze(levelSpec) {
      const { rows, cols, shapeId } = levelSpec;
      const { mask, validCells } = buildConnectedShapeMask(rows, cols, shapeId);
      const grid = Array.from({ length: rows }, (_, r) =>
        Array.from({ length: cols }, (_, c) => ({
          r, c,
          valid: mask[r][c],
          visited: false,
          walls: { top: true, right: true, bottom: true, left: true }
        }))
      );

      const dirs = [
        { dr: -1, dc: 0, w: 'top', opp: 'bottom' },
        { dr: 0, dc: 1, w: 'right', opp: 'left' },
        { dr: 1, dc: 0, w: 'bottom', opp: 'top' },
        { dr: 0, dc: -1, w: 'left', opp: 'right' }
      ];

      // 1. Recursive Backtracking Spanning Tree
      const startSeed = validCells[Math.floor(validCells.length / 2)];
      const stack = [startSeed];
      grid[startSeed[0]][startSeed[1]].visited = true;

      while (stack.length > 0) {
        const [r, c] = stack[stack.length - 1];
        const neighbors = [];
        for (const d of dirs) {
          const nr = r + d.dr, nc = c + d.dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid && !grid[nr][nc].visited) {
            neighbors.push({ nr, nc, w: d.w, opp: d.opp });
          }
        }
        if (neighbors.length > 0) {
          const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
          grid[r][c].walls[pick.w] = false;
          grid[pick.nr][pick.nc].walls[pick.opp] = false;
          grid[pick.nr][pick.nc].visited = true;
          stack.push([pick.nr, pick.nc]);
        } else {
          stack.pop();
        }
      }

      // 2. 100% Braided Maze: Remove EVERY dead-end so ZERO one-way traps exist
      for (const [r, c] of shuffleArray([...validCells])) {
        const cell = grid[r][c];
        if (countOpenPassages(cell) < 2) {
          const closedValid = dirs.filter(d => {
            const nr = r + d.dr, nc = c + d.dc;
            return cell.walls[d.w] && nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid;
          });
          if (closedValid.length > 0) {
            closedValid.sort((a, b) => countOpenPassages(grid[r + a.dr][c + a.dc]) - countOpenPassages(grid[r + b.dr][c + b.dc]));
            const chosen = closedValid[0];
            cell.walls[chosen.w] = false;
            grid[r + chosen.dr][c + chosen.dc].walls[chosen.opp] = false;
          }
        }
      }

      // 3. Extra strategic loops for fun kiting without dash
      for (const [r, c] of validCells) {
        if (Math.random() < 0.08) {
          const cell = grid[r][c];
          const closedValid = dirs.filter(d => {
            const nr = r + d.dr, nc = c + d.dc;
            return cell.walls[d.w] && nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid;
          });
          if (closedValid.length > 0) {
            const pick = closedValid[Math.floor(Math.random() * closedValid.length)];
            cell.walls[pick.w] = false;
            grid[r + pick.dr][c + pick.dc].walls[pick.opp] = false;
          }
        }
      }

      return { grid, validCells };
    }

    function guaranteeSafeMultiExitSpawn(grid, sr, sc) {
      const rows = grid.length, cols = grid[0].length;
      const dirs = [
        { dr: -1, dc: 0, w: 'top', opp: 'bottom' },
        { dr: 0, dc: 1, w: 'right', opp: 'left' },
        { dr: 1, dc: 0, w: 'bottom', opp: 'top' },
        { dr: 0, dc: -1, w: 'left', opp: 'right' }
      ];
      for (const d of dirs) {
        const nr = sr + d.dr, nc = sc + d.dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
          grid[sr][sc].walls[d.w] = false;
          grid[nr][nc].walls[d.opp] = false;
        }
      }
    }

    // =========================================================================

    const STORAGE_KEY = 'cat_catch_mouse_3d_v1_stats';
    function loadSavedStats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return { bestScore: 0 };
    }
    function saveBestScore(score) {
      try {
        const prev = loadSavedStats();
        if (score > (prev.bestScore || 0)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ bestScore: score }));
        }
      } catch (_) {}
    }

    function lerpAngle(current, target, factor) {
      let diff = target - current;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return current + diff * factor;
    }

    function init3DEngine() {
      if (!engine3D.available) return;
      try {
        engine3D.renderer = new THREE.WebGLRenderer({
          canvas: webglCanvas,
          antialias: true,
          alpha: false,
          powerPreference: 'high-performance'
        });
        engine3D.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        engine3D.renderer.shadowMap.enabled = true;
        engine3D.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      } catch (_) {
        engine3D.available = false;
        return;
      }

      engine3D.scene = new THREE.Scene();
      engine3D.scene.background = new THREE.Color('#0f172a');
      engine3D.scene.fog = new THREE.FogExp2('#0f172a', 0.022);

      engine3D.camera = new THREE.PerspectiveCamera(46, 1, 0.1, 180);

      // Balanced studio 3D lighting
      engine3D.ambientLight = new THREE.HemisphereLight('#ffffff', '#1e293b', 0.85);
      engine3D.scene.add(engine3D.ambientLight);

      engine3D.dirLight = new THREE.DirectionalLight('#fff8eb', 0.92);
      engine3D.dirLight.position.set(12, 24, 14);
      engine3D.dirLight.castShadow = true;
      engine3D.dirLight.shadow.mapSize.width = 1024;
      engine3D.dirLight.shadow.mapSize.height = 1024;
      engine3D.dirLight.shadow.camera.near = 2;
      engine3D.dirLight.shadow.camera.far = 65;
      const d = 14;
      engine3D.dirLight.shadow.camera.left = -d;
      engine3D.dirLight.shadow.camera.right = d;
      engine3D.dirLight.shadow.camera.top = d;
      engine3D.dirLight.shadow.camera.bottom = -d;
      engine3D.scene.add(engine3D.dirLight);
      engine3D.scene.add(engine3D.dirLight.target);

      engine3D.playerLight = new THREE.PointLight('#fde68a', 0.85, 7.5);
      engine3D.scene.add(engine3D.playerLight);

      engine3D.levelGroup = new THREE.Group();
      engine3D.scene.add(engine3D.levelGroup);

      engine3D.guideGroup = new THREE.Group();
      engine3D.scene.add(engine3D.guideGroup);

      engine3D.particleGroup = new THREE.Group();
      engine3D.scene.add(engine3D.particleGroup);
    }

    function dispose3DLevel() {
      if (!engine3D.available || !engine3D.levelGroup) return;
      while (engine3D.levelGroup.children.length > 0) {
        engine3D.levelGroup.remove(engine3D.levelGroup.children[0]);
      }
      while (engine3D.guideGroup.children.length > 0) {
        engine3D.guideGroup.remove(engine3D.guideGroup.children[0]);
      }
      while (engine3D.particleGroup.children.length > 0) {
        engine3D.particleGroup.remove(engine3D.particleGroup.children[0]);
      }
      for (const item of engine3D.disposables) {
        if (item && typeof item.dispose === 'function') item.dispose();
      }
      engine3D.disposables = [];
      engine3D.babyMeshes = [];
      engine3D.catMeshes = [];
      engine3D.particlePool = [];
      engine3D.particleInst = null;
      engine3D.playerMesh = null;
      engine3D.playerShieldMesh = null;
      engine3D.playerAngelGroup = null;
      engine3D.heavenBeamMesh = null;
      engine3D.exitGroup = null;
    }

    function track3D(resource) {
      engine3D.disposables.push(resource);
      return resource;
    }

    function buildSculpted3DMouse(isMother, contrastHex) {
      const group = new THREE.Group();
      const scale = isMother ? 1.0 : 0.64;
      group.scale.set(scale, scale, scale);

      const furMain = track3D(new THREE.MeshStandardMaterial({
        color: isMother ? '#f59e0b' : '#fde047',
        roughness: 0.42,
        metalness: 0.06
      }));
      const furDark = track3D(new THREE.MeshStandardMaterial({
        color: isMother ? '#b45309' : '#eab308',
        roughness: 0.5
      }));
      const pinkMat = track3D(new THREE.MeshStandardMaterial({ color: '#fda4af', roughness: 0.45 }));
      const eyeMat = track3D(new THREE.MeshStandardMaterial({ color: '#0f172a', roughness: 0.12, metalness: 0.3 }));
      const whiteMat = track3D(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.2 }));

      // Plump sculpted body (faces +X locally so rotation.y = -angle aligns with (dr, dc))
      const bodyGeo = track3D(new THREE.SphereGeometry(0.26, 18, 14));
      const body = new THREE.Mesh(bodyGeo, furMain);
      body.scale.set(1.22, 0.88, 0.92);
      body.position.set(-0.04, 0.24, 0);
      body.castShadow = true;
      group.add(body);

      // Head + tapered snout
      const headGeo = track3D(new THREE.SphereGeometry(0.18, 16, 14));
      const head = new THREE.Mesh(headGeo, furMain);
      head.scale.set(1.18, 0.95, 0.96);
      head.position.set(0.20, 0.30, 0);
      head.castShadow = true;
      group.add(head);

      const noseGeo = track3D(new THREE.SphereGeometry(0.052, 12, 10));
      const nose = new THREE.Mesh(noseGeo, pinkMat);
      nose.position.set(0.41, 0.29, 0);
      group.add(nose);

      // Big round sculpted ears + pink inner ear
      const earOuterGeo = track3D(new THREE.CylinderGeometry(0.12, 0.12, 0.036, 16));
      const earInnerGeo = track3D(new THREE.CylinderGeometry(0.075, 0.075, 0.042, 14));
      [-1, 1].forEach(side => {
        const ear = new THREE.Mesh(earOuterGeo, furDark);
        ear.rotation.z = Math.PI / 2;
        ear.rotation.y = side * 0.28;
        ear.position.set(0.14, 0.47, side * 0.16);
        ear.castShadow = true;
        group.add(ear);

        const inner = new THREE.Mesh(earInnerGeo, pinkMat);
        inner.rotation.z = Math.PI / 2;
        inner.rotation.y = side * 0.28;
        inner.position.set(0.148, 0.47, side * 0.16);
        group.add(inner);

        // Eyes with white catchlight
        const eye = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.036, 10, 8)), eyeMat);
        eye.position.set(0.32, 0.36, side * 0.088);
        group.add(eye);
        const glint = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.013, 8, 6)), whiteMat);
        glint.position.set(0.348, 0.375, side * 0.085);
        group.add(glint);
      });

      // Articulated paws
      const pawGeo = track3D(new THREE.SphereGeometry(0.06, 10, 8));
      const paws = [];
      [
        [0.14, 0.07, 0.14], [0.14, 0.07, -0.14],
        [-0.18, 0.07, 0.14], [-0.18, 0.07, -0.14]
      ].forEach(([px, py, pz]) => {
        const paw = new THREE.Mesh(pawGeo, pinkMat);
        paw.scale.set(1.2, 0.7, 0.9);
        paw.position.set(px, py, pz);
        group.add(paw);
        paws.push(paw);
      });

      // Wagging sculpted pink tail
      const tailPivot = new THREE.Group();
      tailPivot.position.set(-0.32, 0.20, 0);
      const tailGeo = track3D(new THREE.CylinderGeometry(0.016, 0.032, 0.38, 10));
      const tail = new THREE.Mesh(tailGeo, pinkMat);
      tail.rotation.z = Math.PI / 2 + 0.35;
      tail.position.set(-0.16, 0.06, 0);
      tailPivot.add(tail);
      group.add(tailPivot);

      // Subtle glowing beacon ring under baby mice before rescue
      let beaconRing = null;
      if (!isMother) {
        const ringGeo = track3D(new THREE.RingGeometry(0.30, 0.40, 24));
        const ringMat = track3D(new THREE.MeshBasicMaterial({
          color: '#fde047',
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.78
        }));
        beaconRing = new THREE.Mesh(ringGeo, ringMat);
        beaconRing.rotation.x = -Math.PI / 2;
        beaconRing.position.y = 0.03;
        group.add(beaconRing);
      }

      // Mother Mouse extras: 3D Spawn Shield Dome + 3D Angel Wings & Halo (for 2s heaven ascension)
      let shieldDome = null;
      let angelGroup = null;
      if (isMother) {
        const shieldGeo = track3D(new THREE.SphereGeometry(0.50, 22, 16));
        const shieldMat = track3D(new THREE.MeshBasicMaterial({
          color: '#22d3ee',
          transparent: true,
          opacity: 0.24,
          wireframe: false
        }));
        shieldDome = new THREE.Mesh(shieldGeo, shieldMat);
        shieldDome.position.y = 0.28;
        group.add(shieldDome);

        angelGroup = new THREE.Group();
        angelGroup.visible = false;
        const haloGeo = track3D(new THREE.TorusGeometry(0.18, 0.028, 10, 24));
        const haloMat = track3D(new THREE.MeshBasicMaterial({ color: '#fde047' }));
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.rotation.x = Math.PI / 2;
        halo.position.set(0.08, 0.72, 0);
        angelGroup.add(halo);

        const wingGeo = track3D(new THREE.SphereGeometry(0.22, 12, 10));
        const wingMat = track3D(new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.92 }));
        const leftWing = new THREE.Mesh(wingGeo, wingMat);
        leftWing.scale.set(0.9, 0.22, 1.5);
        leftWing.position.set(-0.06, 0.38, -0.28);
        const rightWing = new THREE.Mesh(wingGeo, wingMat);
        rightWing.scale.set(0.9, 0.22, 1.5);
        rightWing.position.set(-0.06, 0.38, 0.28);
        angelGroup.add(leftWing, rightWing);
        angelGroup.userData = { leftWing, rightWing };
        group.add(angelGroup);
      }

      group.userData = { paws, tailPivot, beaconRing, shieldDome, angelGroup };
      return group;
    }

    function buildSculpted3DCat(catIndex) {
      const coats = [
        { main: '#64748b', stripe: '#334155', belly: '#e2e8f0' }, // Classic Tom Blue-Grey
        { main: '#ea580c', stripe: '#9a3412', belly: '#ffedd5' }, // Ginger Tabby
        { main: '#334155', stripe: '#0f172a', belly: '#f8fafc' }, // Tuxedo Charcoal
        { main: '#d97706', stripe: '#78350f', belly: '#fef3c7' }, // Golden Tiger
        { main: '#7c3aed', stripe: '#4c1d95', belly: '#ede9fe' }  // Royal Violet Cat
      ];
      const palette = coats[catIndex % coats.length];
      const group = new THREE.Group();

      const mainMat = track3D(new THREE.MeshStandardMaterial({ color: palette.main, roughness: 0.45 }));
      const stripeMat = track3D(new THREE.MeshStandardMaterial({ color: palette.stripe, roughness: 0.5 }));
      const bellyMat = track3D(new THREE.MeshStandardMaterial({ color: palette.belly, roughness: 0.45 }));
      const pinkMat = track3D(new THREE.MeshStandardMaterial({ color: '#fb7185', roughness: 0.4 }));
      const eyeMat = track3D(new THREE.MeshStandardMaterial({
        color: '#a3e635',
        emissive: '#65a30d',
        emissiveIntensity: 0.65,
        roughness: 0.15
      }));

      // Sleek sculpted feline body
      const body = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.28, 18, 14)), mainMat);
      body.scale.set(1.38, 0.90, 0.88);
      body.position.set(-0.04, 0.28, 0);
      body.castShadow = true;
      group.add(body);

      // Chest ruff
      const chest = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.18, 14, 12)), bellyMat);
      chest.position.set(0.22, 0.24, 0);
      group.add(chest);

      // Head
      const head = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.21, 16, 14)), mainMat);
      head.scale.set(1.06, 0.96, 1.04);
      head.position.set(0.25, 0.40, 0);
      head.castShadow = true;
      group.add(head);

      // Pointed triangular feline ears
      const earGeo = track3D(new THREE.ConeGeometry(0.085, 0.19, 4));
      [-1, 1].forEach(side => {
        const ear = new THREE.Mesh(earGeo, stripeMat);
        ear.position.set(0.22, 0.61, side * 0.12);
        ear.rotation.x = side * 0.22;
        ear.castShadow = true;
        group.add(ear);

        const eye = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.046, 10, 8)), eyeMat);
        eye.position.set(0.42, 0.44, side * 0.088);
        group.add(eye);
      });

      // Nose
      const nose = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.04, 10, 8)), pinkMat);
      nose.position.set(0.46, 0.37, 0);
      group.add(nose);

      // Striding legs
      const legGeo = track3D(new THREE.CylinderGeometry(0.046, 0.042, 0.22, 10));
      const legs = [];
      [
        [0.16, 0.11, 0.14], [0.16, 0.11, -0.14],
        [-0.22, 0.11, 0.14], [-0.22, 0.11, -0.14]
      ].forEach(([lx, ly, lz]) => {
        const leg = new THREE.Mesh(legGeo, stripeMat);
        leg.position.set(lx, ly, lz);
        group.add(leg);
        legs.push(leg);
      });

      // Upright swishing tail
      const tailPivot = new THREE.Group();
      tailPivot.position.set(-0.36, 0.28, 0);
      const tail = new THREE.Mesh(track3D(new THREE.CylinderGeometry(0.028, 0.042, 0.44, 10)), stripeMat);
      tail.rotation.z = 0.45;
      tail.position.set(-0.08, 0.20, 0);
      tailPivot.add(tail);
      group.add(tailPivot);

      // Floating 3D Red Alert Crystal (!) when chasing closely
      const alertGroup = new THREE.Group();
      alertGroup.position.set(0.20, 0.92, 0);
      const alertMat = track3D(new THREE.MeshBasicMaterial({ color: '#ef4444' }));
      const alertBar = new THREE.Mesh(track3D(new THREE.BoxGeometry(0.07, 0.22, 0.07)), alertMat);
      alertBar.position.y = 0.08;
      const alertDot = new THREE.Mesh(track3D(new THREE.SphereGeometry(0.045, 8, 8)), alertMat);
      alertDot.position.y = -0.09;
      alertGroup.add(alertBar, alertDot);
      alertGroup.visible = false;
      group.add(alertGroup);

      group.userData = { legs, tailPivot, eyeMat, alertGroup };
      return group;
    }

    function build3DLevelScene() {
      if (!engine3D.available) return;
      dispose3DLevel();

      const spec = LEVELS[gameState.currentLevelIdx];
      const { grid, validCells, exitCell, babies, cats } = gameState;
      const rows = grid.length, cols = grid[0].length;

      engine3D.scene.background = new THREE.Color(spec.skyHex);
      engine3D.scene.fog = new THREE.FogExp2(spec.skyHex, 0.018);

      // 1. Instanced 3D Floor Tiles (2 alternating materials for crisp architectural checkerboard)
      const floorGeo = track3D(new THREE.BoxGeometry(0.97, 0.14, 0.97));
      const floorMatA = track3D(new THREE.MeshStandardMaterial({ color: spec.floorColor, roughness: 0.72, metalness: 0.08 }));
      const floorMatB = track3D(new THREE.MeshStandardMaterial({ color: spec.floorAltColor, roughness: 0.72, metalness: 0.08 }));

      const cellsA = [], cellsB = [];
      for (const [r, c] of validCells) {
        if ((r + c) % 2 === 0) cellsA.push([r, c]);
        else cellsB.push([r, c]);
      }

      const dummy = new THREE.Object3D();
      if (cellsA.length > 0) {
        const instA = new THREE.InstancedMesh(floorGeo, floorMatA, cellsA.length);
        instA.receiveShadow = true;
        cellsA.forEach(([r, c], i) => {
          dummy.position.set(c, -0.07, r);
          dummy.scale.set(1, 1, 1);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          instA.setMatrixAt(i, dummy.matrix);
        });
        engine3D.levelGroup.add(instA);
      }
      if (cellsB.length > 0) {
        const instB = new THREE.InstancedMesh(floorGeo, floorMatB, cellsB.length);
        instB.receiveShadow = true;
        cellsB.forEach(([r, c], i) => {
          dummy.position.set(c, -0.07, r);
          dummy.scale.set(1, 1, 1);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          instB.setMatrixAt(i, dummy.matrix);
        });
        engine3D.levelGroup.add(instB);
      }

      // 2. Collect unique 3D Wall Segments (horizontal & vertical) + Corner Pillars for InstancedMesh
      const hWallKeys = new Set();
      const vWallKeys = new Set();
      const pillarKeys = new Set();
      const hWalls = [], vWalls = [], pillars = [];

      const addPillar = (pr, pc) => {
        const k = `${pr},${pc}`;
        if (!pillarKeys.has(k)) { pillarKeys.add(k); pillars.push([pr, pc]); }
      };

      for (const [r, c] of validCells) {
        const w = grid[r][c].walls;
        if (w.top) {
          const k = `${r},${c}`;
          if (!hWallKeys.has(k)) { hWallKeys.add(k); hWalls.push([r - 0.5, c]); addPillar(r - 0.5, c - 0.5); addPillar(r - 0.5, c + 0.5); }
        }
        if (w.bottom) {
          const k = `${r + 1},${c}`;
          if (!hWallKeys.has(k)) { hWallKeys.add(k); hWalls.push([r + 0.5, c]); addPillar(r + 0.5, c - 0.5); addPillar(r + 0.5, c + 0.5); }
        }
        if (w.left) {
          const k = `${r},${c}`;
          if (!vWallKeys.has(k)) { vWallKeys.add(k); vWalls.push([r, c - 0.5]); addPillar(r - 0.5, c - 0.5); addPillar(r + 0.5, c - 0.5); }
        }
        if (w.right) {
          const k = `${r},${c + 1}`;
          if (!vWallKeys.has(k)) { vWallKeys.add(k); vWalls.push([r, c + 0.5]); addPillar(r - 0.5, c + 0.5); addPillar(r + 0.5, c + 0.5); }
        }
      }

      const wallHeight = 0.66;
      const wallThick = 0.16;
      const wallBodyMat = track3D(new THREE.MeshStandardMaterial({ color: spec.wallColor, roughness: 0.42, metalness: 0.12 }));
      const wallCapMat = track3D(new THREE.MeshStandardMaterial({ color: spec.wallTopColor, roughness: 0.25, metalness: 0.15 }));

      // Horizontal + Vertical walls combined into 2 InstancedMeshes (body + glossy top cap)
      const totalWalls = hWalls.length + vWalls.length;
      if (totalWalls > 0) {
        const segBodyGeo = track3D(new THREE.BoxGeometry(1.0, wallHeight, wallThick));
        const segCapGeo = track3D(new THREE.BoxGeometry(1.02, 0.08, wallThick + 0.03));
        const instBody = new THREE.InstancedMesh(segBodyGeo, wallBodyMat, totalWalls);
        const instCap = new THREE.InstancedMesh(segCapGeo, wallCapMat, totalWalls);
        instBody.castShadow = true;
        instBody.receiveShadow = true;

        let idx = 0;
        for (const [wr, wc] of hWalls) {
          dummy.position.set(wc, wallHeight / 2, wr);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          instBody.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(wc, wallHeight + 0.03, wr);
          dummy.updateMatrix();
          instCap.setMatrixAt(idx, dummy.matrix);
          idx++;
        }
        for (const [wr, wc] of vWalls) {
          dummy.position.set(wc, wallHeight / 2, wr);
          dummy.rotation.set(0, Math.PI / 2, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          instBody.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(wc, wallHeight + 0.03, wr);
          dummy.updateMatrix();
          instCap.setMatrixAt(idx, dummy.matrix);
          idx++;
        }
        engine3D.levelGroup.add(instBody, instCap);
      }

      // Corner Architectural Pillars
      if (pillars.length > 0) {
        const pilGeo = track3D(new THREE.BoxGeometry(wallThick + 0.05, wallHeight + 0.10, wallThick + 0.05));
        const instPil = new THREE.InstancedMesh(pilGeo, wallCapMat, pillars.length);
        pillars.forEach(([pr, pc], i) => {
          dummy.position.set(pc, (wallHeight + 0.10) / 2, pr);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          instPil.setMatrixAt(i, dummy.matrix);
        });
        engine3D.levelGroup.add(instPil);
      }

      // 3. 3D Exit Portal (Recessed pad + Twin Rotating Energy Rings + Vertical Beacon Beam)
      const exitGroup = new THREE.Group();
      exitGroup.position.set(exitCell.c, 0, exitCell.r);
      const padMat = track3D(new THREE.MeshStandardMaterial({
        color: '#64748b',
        emissive: '#334155',
        emissiveIntensity: 0.4,
        roughness: 0.3
      }));
      const pad = new THREE.Mesh(track3D(new THREE.CylinderGeometry(0.42, 0.46, 0.08, 24)), padMat);
      pad.position.y = 0.04;
      exitGroup.add(pad);

      const ringMat = track3D(new THREE.MeshBasicMaterial({ color: '#94a3b8' }));
      const ring1 = new THREE.Mesh(track3D(new THREE.TorusGeometry(0.36, 0.035, 10, 28)), ringMat);
      ring1.position.y = 0.45;
      const ring2 = new THREE.Mesh(track3D(new THREE.TorusGeometry(0.26, 0.028, 10, 24)), ringMat);
      ring2.position.y = 0.45;
      ring2.rotation.y = Math.PI / 2;
      exitGroup.add(ring1, ring2);

      const beamMat = track3D(new THREE.MeshBasicMaterial({
        color: '#34d399',
        transparent: true,
        opacity: 0.22,
        side: THREE.DoubleSide
      }));
      const beam = new THREE.Mesh(track3D(new THREE.CylinderGeometry(0.26, 0.36, 4.5, 16, 1, true)), beamMat);
      beam.position.y = 2.25;
      beam.visible = false;
      exitGroup.add(beam);

      engine3D.exitGroup = exitGroup;
      engine3D.exitRing1 = ring1;
      engine3D.exitRing2 = ring2;
      engine3D.exitBeam = beam;
      engine3D.exitPadMat = padMat;
      engine3D.exitRingMat = ringMat;
      engine3D.levelGroup.add(exitGroup);

      // 4. Mother Mouse + Heaven Spotlight Beam
      engine3D.playerMesh = buildSculpted3DMouse(true, spec.contrastHex);
      engine3D.playerShieldMesh = engine3D.playerMesh.userData.shieldDome;
      engine3D.playerAngelGroup = engine3D.playerMesh.userData.angelGroup;
      engine3D.levelGroup.add(engine3D.playerMesh);

      const hBeamMat = track3D(new THREE.MeshBasicMaterial({
        color: '#fef08a',
        transparent: true,
        opacity: 0.26,
        side: THREE.DoubleSide
      }));
      engine3D.heavenBeamMesh = new THREE.Mesh(track3D(new THREE.CylinderGeometry(0.55, 0.85, 7.0, 20, 1, true)), hBeamMat);
      engine3D.heavenBeamMesh.visible = false;
      engine3D.levelGroup.add(engine3D.heavenBeamMesh);

      // 5. Baby Mice
      engine3D.babyMeshes = babies.map((b) => {
        const mesh = buildSculpted3DMouse(false, spec.contrastHex);
        mesh.position.set(b.c, 0, b.r);
        engine3D.levelGroup.add(mesh);
        return mesh;
      });

      // 6. Patrol Cats
      engine3D.catMeshes = cats.map((cat, idx) => {
        const mesh = buildSculpted3DCat(idx);
        mesh.position.set(cat.c, 0, cat.r);
        engine3D.levelGroup.add(mesh);
        return mesh;
      });

      // 7. Pooled 3D Sparkle & Dust Particle InstancedMesh (1 draw call)
      const pGeo = track3D(new THREE.SphereGeometry(0.08, 8, 6));
      const pMat = track3D(new THREE.MeshBasicMaterial({ color: '#fde047' }));
      engine3D.particleInst = new THREE.InstancedMesh(pGeo, pMat, 48);
      engine3D.particleInst.count = 0;
      engine3D.particleGroup.add(engine3D.particleInst);

      rebuild3DGuideOrbs();
    }

    function rebuild3DGuideOrbs() {
      if (!engine3D.available || !engine3D.guideGroup) return;
      while (engine3D.guideGroup.children.length > 0) {
        engine3D.guideGroup.remove(engine3D.guideGroup.children[0]);
      }
      if (!gameState.showBFSOverlay || !isGuideAllowedForCurrentLevel()) return;
      if (!gameState.bfsPathsToTargets.length) return;

      const orbGeo = track3D(new THREE.SphereGeometry(0.11, 10, 8));
      const orbMat = track3D(new THREE.MeshBasicMaterial({ color: '#fef08a' }));
      const path = gameState.bfsPathsToTargets[0];
      for (let i = 1; i < path.length; i++) {
        const [r, c] = path[i];
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.position.set(c, 0.24, r);
        engine3D.guideGroup.add(orb);
      }
    }

    // =========================================================================
    // 7. MINIMAP CACHE & BFS UPDATE
    // =========================================================================
    function rebuildMinimapCache() {
      const spec = LEVELS[gameState.currentLevelIdx];
      const { grid } = gameState;
      const rows = grid.length, cols = grid[0].length;
      const mini = gameState.minimapCache.canvas;
      const miniSize = 96;
      mini.width = miniSize;
      mini.height = miniSize;
      const mctx = mini.getContext('2d');
      mctx.clearRect(0, 0, miniSize, miniSize);
      mctx.fillStyle = 'rgba(10, 15, 30, 0.80)';
      mctx.fillRect(0, 0, miniSize, miniSize);
      const mCell = (miniSize - 8) / Math.max(rows, cols);
      const mOffX = (miniSize - cols * mCell) / 2;
      const mOffY = (miniSize - rows * mCell) / 2;
      mctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].valid) {
            mctx.fillRect(mOffX + c * mCell, mOffY + r * mCell, Math.max(1.2, mCell), Math.max(1.2, mCell));
          }
        }
      }
      mctx.strokeStyle = spec.contrastHex;
      mctx.lineWidth = 1.5;
      mctx.strokeRect(0.75, 0.75, miniSize - 1.5, miniSize - 1.5);
      gameState.minimapCache.dirty = false;
    }

    function updatePlayerBFS(force = false) {
      const pr = Math.round(gameState.player.r);
      const pc = Math.round(gameState.player.c);
      if (!force && pr === gameState.lastBFSPlayerCell.r && pc === gameState.lastBFSPlayerCell.c) return;
      gameState.lastBFSPlayerCell = { r: pr, c: pc };

      const { distMap, parentMap } = computeBFSReachability(gameState.grid, pr, pc);
      gameState.playerBFSMap = distMap;

      if (!gameState.showBFSOverlay || !isGuideAllowedForCurrentLevel()) {
        gameState.bfsPathsToTargets = [];
        rebuild3DGuideOrbs();
        return;
      }

      const targets = gameState.babies.filter(b => !b.rescued).map(b => [b.r, b.c]);
      if (targets.length === 0) targets.push([gameState.exitCell.r, gameState.exitCell.c]);
      targets.sort((a, b) => {
        const da = distMap[a[0]] ? distMap[a[0]][a[1]] : 9999;
        const db = distMap[b[0]] ? distMap[b[0]][b[1]] : 9999;
        return da - db;
      });
      gameState.bfsPathsToTargets = [reconstructPath(parentMap, pr, pc, targets[0][0], targets[0][1])];
      rebuild3DGuideOrbs();
    }

    // =========================================================================
    // 8. LEVEL LOADING & PROGRESSION
    // =========================================================================
    function loadLevel(idx, autoStart = false, resetLives = true) {
      stopLoops();
      hideOverlay();
      gameState.currentLevelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
      gameState.hasActiveSession = autoStart;
      gameState.deathAnim.active = false;
      gameState.celebration.active = false;
      gameState.fxParticles = [];
      gameState.floatingTexts = [];
      if (resetLives) gameState.lives = 3;
      if (!isGuideAllowedForCurrentLevel()) gameState.showBFSOverlay = false;

      const spec = LEVELS[gameState.currentLevelIdx];
      document.getElementById('app-body').style.background = spec.bgGradient;

      const { grid, validCells } = generateShapedMaze(spec);
      gameState.grid = grid;
      gameState.validCells = validCells;

      // Pick central open spawn hub for Mother Mouse
      const midR = spec.rows / 2, midC = spec.cols / 2;
      const sortedByCenter = [...validCells].sort((a, b) => Math.hypot(a[0] - midR, a[1] - midC) - Math.hypot(b[0] - midR, b[1] - midC));
      const startPos = sortedByCenter[0];
      guaranteeSafeMultiExitSpawn(grid, startPos[0], startPos[1]);

      const { distMap } = computeBFSReachability(grid, startPos[0], startPos[1]);
      gameState.playerBFSMap = distMap;

      const reachableCells = validCells
        .filter(([r, c]) => distMap[r][c] > 0)
        .sort((a, b) => distMap[b[0]][b[1]] - distMap[a[0]][a[1]]);

      const exitPos = reachableCells[0] || validCells[validCells.length - 1];

      gameState.player = {
        r: startPos[0], c: startPos[1],
        fromR: startPos[0], fromC: startPos[1],
        targetR: startPos[0], targetC: startPos[1],
        moveDir: { dr: 0, dc: 0 },
        heldDir: null,
        bufferedDir: null,
        bufferedAt: 0,
        angle: 0,
        visualAngle: 0,
        walkPhase: 0
      };
      gameState.camera.r = startPos[0];
      gameState.camera.c = startPos[1];

      gameState.exitCell = { r: exitPos[0], c: exitPos[1], unlocked: false };
      gameState.rescuedTrail = [{ r: startPos[0], c: startPos[1], angle: 0 }];
      gameState.shieldUntil = Date.now() + 3000;
      gameState.lastBFSPlayerCell = { r: -1, c: -1 };
      gameState.lastTensionUIState = false;
      gameState.lastVignetteOpacity = -1;
      document.getElementById('tension-vignette').style.opacity = '0';

      // Spawn Baby Mice well-distributed across maze
      const occupied = new Set([`${startPos[0]},${startPos[1]}`, `${exitPos[0]},${exitPos[1]}`]);
      const babyPool = shuffleArray(reachableCells.filter(([r, c]) => distMap[r][c] >= 4 && !occupied.has(`${r},${c}`)));
      gameState.babies = [];
      for (let i = 0; i < spec.babies && i < babyPool.length; i++) {
        const [br, bc] = babyPool[i];
        occupied.add(`${br},${bc}`);
        gameState.babies.push({ id: i, r: br, c: bc, rescued: false, bobPhase: Math.random() * Math.PI * 2 });
      }

      // Spawn Patrol Cats safely far from player
      const farCatPool = reachableCells.filter(([r, c]) => distMap[r][c] >= 8 && !occupied.has(`${r},${c}`));
      const catPool = farCatPool.length >= spec.cats ? farCatPool : reachableCells.filter(([r, c]) => !occupied.has(`${r},${c}`));
      gameState.cats = [];
      const stride = Math.max(1, Math.floor(catPool.length / Math.max(1, spec.cats)));
      for (let i = 0; i < spec.cats; i++) {
        const pick = catPool[Math.min(i * stride, catPool.length - 1)] || exitPos;
        gameState.cats.push({
          id: i,
          r: pick[0], c: pick[1],
          targetR: pick[0], targetC: pick[1],
          lastR: pick[0], lastC: pick[1],
          angle: 0, visualAngle: 0, stridePhase: i * 1.4, alerted: false
        });
      }

      rebuildMinimapCache();
      build3DLevelScene();
      updatePlayerBFS(true);
      updateFullLevelUI();

      if (autoStart) {
        startGameplay();
      } else {
        renderFrame();
      }
    }
