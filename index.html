    function canMoveFromCell(r, c, dr, dc) {
      if (dr === 0 && dc === 0) return false;
      const cell = gameState.grid[r] && gameState.grid[r][c];
      if (!cell || !cell.valid) return false;
      if (dr === -1 && cell.walls.top) return false;
      if (dr === 1 && cell.walls.bottom) return false;
      if (dc === -1 && cell.walls.left) return false;
      if (dc === 1 && cell.walls.right) return false;
      const nr = r + dr, nc = c + dc;
      return !!(gameState.grid[nr] && gameState.grid[nr][nc] && gameState.grid[nr][nc].valid);
    }

    function updateSmoothEntities(dt) {
      const p = gameState.player;
      const nowMs = Date.now();
      const playerSpeed = 5.3;
      let remaining = playerSpeed * dt;
      let movedAny = false;

      // Expire stale turn buffer after 280ms
      if (p.bufferedDir && nowMs - p.bufferedAt > 280) {
        p.bufferedDir = null;
      }

      while (remaining > 0.0001) {
        const isMoving = p.moveDir.dr !== 0 || p.moveDir.dc !== 0;

        // Instant 180-degree mid-corridor reversal if heldDir opposes current moveDir
        if (isMoving && p.heldDir && p.heldDir.dr === -p.moveDir.dr && p.heldDir.dc === -p.moveDir.dc) {
          const oldTR = p.targetR, oldTC = p.targetC;
          p.targetR = p.fromR; p.targetC = p.fromC;
          p.fromR = oldTR; p.fromC = oldTC;
          p.moveDir = { dr: p.heldDir.dr, dc: p.heldDir.dc };
          p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
          p.bufferedDir = null;
        }

        if (!isMoving) {
          const wantDir = p.heldDir || p.bufferedDir;
          if (wantDir && canMoveFromCell(p.r, p.c, wantDir.dr, wantDir.dc)) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + wantDir.dr;
            p.targetC = p.c + wantDir.dc;
            p.moveDir = { dr: wantDir.dr, dc: wantDir.dc };
            p.angle = Math.atan2(wantDir.dr, wantDir.dc);
            if (p.bufferedDir && p.bufferedDir.dr === wantDir.dr && p.bufferedDir.dc === wantDir.dc) {
              p.bufferedDir = null;
            }
          } else {
            break;
          }
        }

        const distToTarget = Math.hypot(p.targetR - p.r, p.targetC - p.c);
        if (remaining < distToTarget) {
          p.r += p.moveDir.dr * remaining;
          p.c += p.moveDir.dc * remaining;
          p.walkPhase += remaining * 12;
          remaining = 0;
          movedAny = true;
        } else {
          p.r = p.targetR;
          p.c = p.targetC;
          p.walkPhase += distToTarget * 12;
          remaining -= distToTarget;
          movedAny = true;

          // At exact cell center: check buffered turn first (within 280ms), then heldDir
          const validBuf = p.bufferedDir && canMoveFromCell(p.r, p.c, p.bufferedDir.dr, p.bufferedDir.dc);
          if (validBuf) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + p.bufferedDir.dr;
            p.targetC = p.c + p.bufferedDir.dc;
            p.moveDir = { dr: p.bufferedDir.dr, dc: p.bufferedDir.dc };
            p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
            p.bufferedDir = null;
          } else if (p.heldDir && canMoveFromCell(p.r, p.c, p.heldDir.dr, p.heldDir.dc)) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + p.heldDir.dr;
            p.targetC = p.c + p.heldDir.dc;
            p.moveDir = { dr: p.heldDir.dr, dc: p.heldDir.dc };
            p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
          } else {
            p.moveDir = { dr: 0, dc: 0 };
            remaining = 0;
          }
        }
      }

      // Smooth visual rotation for Mother Mouse
      p.visualAngle = lerpAngle(p.visualAngle, p.angle, 1 - Math.exp(-22 * dt));

      if (movedAny) {
        gameState.stepCounter++;
        sound.playStepPluck(gameState.stepCounter);

        // Occasional subtle running dust puff
        if (Math.random() < 0.16) {
          gameState.fxParticles.push({
            r: p.r - Math.sin(p.angle) * 0.25,
            c: p.c - Math.cos(p.angle) * 0.25,
            vr: (Math.random() - 0.5) * 0.4,
            vc: (Math.random() - 0.5) * 0.4,
            size: 2.2,
            life: 0.28,
            maxLife: 0.28,
            color: 'rgba(255,255,255,0.52)'
          });
        }

        const head = gameState.rescuedTrail[0];
        if (!head || Math.hypot(p.r - head.r, p.c - head.c) >= 0.30) {
          gameState.rescuedTrail.unshift({ r: p.r, c: p.c, angle: p.visualAngle });
          if (gameState.rescuedTrail.length > 70) gameState.rescuedTrail.pop();
        }
        updatePlayerBFS(false);
      }

      // Update world juice particles & floating score popups
      for (let i = gameState.fxParticles.length - 1; i >= 0; i--) {
        const pt = gameState.fxParticles[i];
        pt.r += pt.vr * dt;
        pt.c += pt.vc * dt;
        pt.life -= dt;
        if (pt.life <= 0) gameState.fxParticles.splice(i, 1);
      }
      for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
        const ft = gameState.floatingTexts[i];
        ft.r -= 1.2 * dt;
        ft.life -= dt;
        if (ft.life <= 0) gameState.floatingTexts.splice(i, 1);
      }

      // Smooth Camera Follow
      const camLerp = 1 - Math.exp(-16 * dt);
      gameState.camera.r += (p.r - gameState.camera.r) * camLerp;
      gameState.camera.c += (p.c - gameState.camera.c) * camLerp;

      // Advance Patrol Cats
      let minCatDist = Infinity;
      gameState.cats.forEach((cat, idx) => {
        const distToPlayer = Math.hypot(cat.r - p.r, cat.c - p.c);
        if (distToPlayer < minCatDist) minCatDist = distToPlayer;
        cat.alerted = distToPlayer < 4.2 && !isPlayerProtected();

        const lvlScale = gameState.currentLevelIdx;
        const patrolSpd = 2.12 + Math.min(0.60, lvlScale * 0.032);
        const chaseSpd = 2.68 + Math.min(0.75, lvlScale * 0.04);
        const catSpeed = cat.alerted ? chaseSpd : patrolSpd;
        let remCat = catSpeed * dt;
        while (remCat > 0) {
          const drc = cat.targetR - cat.r;
          const dcc = cat.targetC - cat.c;
          const distC = Math.hypot(drc, dcc);
          if (distC > remCat) {
            cat.r += (drc / distC) * remCat;
            cat.c += (dcc / distC) * remCat;
            cat.stridePhase += remCat * 8;
            cat.angle = Math.atan2(drc, dcc);
            remCat = 0;
          } else {
            cat.r = cat.targetR;
            cat.c = cat.targetC;
            cat.stridePhase += distC * 8;
            remCat -= distC;
            chooseNextCatTarget(cat, idx);
            if (cat.targetR === cat.r && cat.targetC === cat.c) break;
          }
        }
        cat.visualAngle = lerpAngle(cat.visualAngle, cat.angle, 1 - Math.exp(-16 * dt));
      });

      // Proximity Tension Music & Vignette
      const tension = minCatDist < 6.0 ? Math.min(1, (6.0 - minCatDist) / 4.2) : 0;
      sound.setTension(tension);

      const roundedOp = Math.round(tension * 0.85 * 20) / 20;
      if (roundedOp !== gameState.lastVignetteOpacity) {
        gameState.lastVignetteOpacity = roundedOp;
        document.getElementById('tension-vignette').style.opacity = String(roundedOp);
      }

      const isDangerNow = tension > 0.35;
      if (isDangerNow !== gameState.lastTensionUIState) {
        gameState.lastTensionUIState = isDangerNow;
        const islandStatus = document.getElementById('island-status');
        const dangerLed = document.getElementById('danger-led');
        if (isDangerNow) {
          islandStatus.textContent = '⚠️ DANGER';
          islandStatus.className = 'text-[9px] text-rose-400 font-black tracking-wider';
          dangerLed.className = 'w-2 h-2 rounded-full bg-rose-500';
        } else {
          islandStatus.textContent = `L${LEVELS[gameState.currentLevelIdx].level}`;
          islandStatus.className = 'text-[9px] text-white/85 font-extrabold tracking-wider';
          dangerLed.className = 'w-2 h-2 rounded-full bg-emerald-400';
        }
      }

      checkSmoothPlayerInteractions();
    }

    // Smart BFS-assisted Cat AI (Cat #0 uses real maze shortest-path BFS when within 8 steps; never gets stuck behind walls!)
    function chooseNextCatTarget(cat, idx) {
      const { grid, player, cats, playerBFSMap } = gameState;
      const rows = grid.length, cols = grid[0].length;
      const cr = Math.round(cat.r), cc = Math.round(cat.c);
      const cell = grid[cr] && grid[cr][cc];
      if (!cell) return;

      const moveOptions = [
        { dr: -1, dc: 0, wall: 'top' },
        { dr: 1, dc: 0, wall: 'bottom' },
        { dr: 0, dc: -1, wall: 'left' },
        { dr: 0, dc: 1, wall: 'right' }
      ];

      const validMoves = [];
      for (const m of moveOptions) {
        if (!cell.walls[m.wall]) {
          const nr = cr + m.dr, nc = cc + m.dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].valid) {
            validMoves.push({ nr, nc });
          }
        }
      }
      if (validMoves.length === 0) return;

      let filtered = validMoves.filter(m => !(m.nr === cat.lastR && m.nc === cat.lastC));
      if (filtered.length === 0) filtered = validMoves;

      const uncrowded = filtered.filter(
        m => !cats.some(other => other.id !== cat.id && other.targetR === m.nr && other.targetC === m.nc)
      );
      if (uncrowded.length > 0) filtered = uncrowded;

      const shielded = isPlayerProtected();
      let chosen = filtered[0];

      if (shielded) {
        // Flee away from shielded player
        filtered.sort((a, b) => Math.hypot(b.nr - player.r, b.nc - player.c) - Math.hypot(a.nr - player.r, a.nc - player.c));
        chosen = filtered[0];
      } else if (playerBFSMap && playerBFSMap[cr] && playerBFSMap[cr][cc] > 0 && playerBFSMap[cr][cc] <= 9 && (idx === 0 || Math.random() < 0.55)) {
        // True BFS maze-path pursuit!
        filtered.sort((a, b) => {
          const da = playerBFSMap[a.nr][a.nc] >= 0 ? playerBFSMap[a.nr][a.nc] : 999;
          const db = playerBFSMap[b.nr][b.nc] >= 0 ? playerBFSMap[b.nr][b.nc] : 999;
          return da - db;
        });
        chosen = filtered[0];
      } else if (Math.random() < (idx === 0 ? 0.6 : 0.35)) {
        filtered.sort((a, b) => Math.hypot(a.nr - player.r, a.nc - player.c) - Math.hypot(b.nr - player.r, b.nc - player.c));
        chosen = filtered[0];
      } else {
        chosen = filtered[Math.floor(Math.random() * filtered.length)];
      }

      cat.lastR = cr; cat.lastC = cc;
      cat.targetR = chosen.nr; cat.targetC = chosen.nc;
    }

    function checkSmoothPlayerInteractions() {
      const { player, babies, cats, exitCell } = gameState;
      const spec = LEVELS[gameState.currentLevelIdx];

      let newlyRescued = false;
      babies.forEach(b => {
        if (!b.rescued && Math.hypot(b.r - player.r, b.c - player.c) < 0.58) {
          b.rescued = true;
          newlyRescued = true;
          gameState.score += 150;
          sound.playSqueak();
          spawnWorldJuice(b.r, b.c, '#fde047', 14, '+150 🐭');
        }
      });

      const rescuedCount = babies.filter(b => b.rescued).length;
      if (newlyRescued) {
        if (rescuedCount === spec.babies) {
          exitCell.unlocked = true;
          spawnWorldJuice(exitCell.r, exitCell.c, '#34d399', 18, '🚪 出口開啟!');
          showToast('🚪 出口已開啟！', 'bg-emerald-300 text-slate-950');
        }
        updatePlayerBFS(true);
        updateHUDCountersOnly();
      }

      if (exitCell.unlocked && Math.hypot(exitCell.r - player.r, exitCell.c - player.c) < 0.58) {
        gameState.score += 500 + spec.level * 100;
        sound.playVictoryFanfare();
        handleSeamlessLevelClear();
        return;
      }

      if (!isPlayerProtected()) {
        const hitCat = cats.find(cat => Math.hypot(cat.r - player.r, cat.c - player.c) < 0.44);
        if (hitCat) triggerHeavenDeathSequence();
      }
    }

    function triggerHeavenDeathSequence() {
      gameState.status = 'dying_heaven';
      gameState.player.moveDir = { dr: 0, dc: 0 };
      gameState.player.heldDir = null;
      gameState.player.bufferedDir = null;
      gameState.virtualStick.active = false;
      highlightActiveDpadButton(null, 0, 0);

      sound.stopChaseBGM();
      sound.playCatCrashAndHeaven();
      document.getElementById('tension-vignette').style.opacity = '0.9';

      gameState.deathAnim = {
        active: true, startTime: performance.now(), duration: 2000,
        r: gameState.player.r, c: gameState.player.c
      };

      gameState.lives--;
      updateHUDCountersOnly();
      showToast('👼 升天中...', 'bg-amber-300 text-slate-950');
    }

    function updateDeathHeavenAnimation(now) {
      if (now - gameState.deathAnim.startTime >= gameState.deathAnim.duration) {
        gameState.deathAnim.active = false;
        document.getElementById('tension-vignette').style.opacity = '0';
        if (gameState.lives > 0) {
          loadLevel(gameState.currentLevelIdx, true, false);
          showToast(`❤️ 剩餘 ${gameState.lives} 命`, 'bg-yellow-300 text-slate-950');
        } else {
          handleOutOfThreeLivesSeamless();
        }
      }
    }

    // =========================================================================
    // 10. APP-STORE QUALITY CANVAS RENDERER (SOFT SHADOWS, BLINK, SHIELD ARC)
    // =========================================================================
    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      const rect = wrapper.getBoundingClientRect();
      gameState.canvasSize = {
        width: rect.width || 320,
        height: rect.height || 320,
        left: rect.left,
        top: rect.top
      };
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(gameState.canvasSize.width * dpr);
      canvas.height = Math.floor(gameState.canvasSize.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderMazeFrame();
    }

    function drawArticulatedMouse(ctx, x, y, radius, angle, walkPhase, isMother, contrastHex, shieldProgress) {
      ctx.save();
      ctx.translate(x, y);

      // Soft ground contact shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
      ctx.beginPath();
      ctx.ellipse(2, 4, radius * 0.95, radius * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();

      if (isMother) {
        // Spotlight or Shield Countdown Ring
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.48, 0, Math.PI * 2);
        ctx.fillStyle = shieldProgress > 0 ? 'rgba(34, 211, 238, 0.22)' : 'rgba(255, 255, 255, 0.08)';
        ctx.fill();
        ctx.lineWidth = shieldProgress > 0 ? 2.6 : 1.6;
        ctx.strokeStyle = shieldProgress > 0 ? '#22d3ee' : contrastHex;
        if (shieldProgress > 0) {
          ctx.beginPath();
          ctx.arc(0, 0, radius * 1.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * shieldProgress);
          ctx.stroke();
        } else {
          ctx.stroke();
        }
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.32, 0, Math.PI * 2);
        ctx.strokeStyle = contrastHex;
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }

      ctx.rotate(angle);
      const wag = Math.sin(walkPhase) * 0.38;
      const pawSwing = Math.sin(walkPhase) * (radius * 0.28);

      // Tail
      ctx.beginPath();
      ctx.moveTo(-radius * 0.75, 0);
      ctx.quadraticCurveTo(-radius * 1.45, wag * radius * 1.25, -radius * 2.08, -wag * radius * 0.7);
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = Math.max(1.8, radius * 0.18);
      ctx.lineCap = 'round';
      ctx.stroke();

      // 4 Paws
      ctx.fillStyle = '#fbcfe8';
      const pawR = radius * 0.22;
      ctx.beginPath();
      ctx.arc(radius * 0.38 + pawSwing, -radius * 0.56, pawR, 0, Math.PI * 2);
      ctx.arc(radius * 0.38 - pawSwing, radius * 0.56, pawR, 0, Math.PI * 2);
      ctx.arc(-radius * 0.38 - pawSwing, -radius * 0.54, pawR, 0, Math.PI * 2);
      ctx.arc(-radius * 0.38 + pawSwing, radius * 0.54, pawR, 0, Math.PI * 2);
      ctx.fill();

      // Torso
      ctx.fillStyle = isMother ? '#d97706' : '#fbbf24';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(-radius * 0.1, 0, radius * 0.82, radius * 0.58, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.ellipse(-radius * 0.05, 0, radius * 0.48, radius * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head & Snout
      ctx.fillStyle = isMother ? '#f59e0b' : '#fde047';
      ctx.beginPath();
      ctx.moveTo(radius * 1.05, 0);
      ctx.quadraticCurveTo(radius * 0.45, -radius * 0.58, 0, -radius * 0.45);
      ctx.quadraticCurveTo(-radius * 0.25, 0, 0, radius * 0.45);
      ctx.quadraticCurveTo(radius * 0.45, radius * 0.58, radius * 1.05, 0);
      ctx.fill();
      ctx.stroke();

      // Rounded Mouse Ears
      const earX = radius * 0.12, earY = radius * 0.52, earR = radius * 0.42;
      ctx.fillStyle = isMother ? '#b45309' : '#eab308';
      ctx.beginPath();
      ctx.arc(earX, -earY, earR, 0, Math.PI * 2);
      ctx.arc(earX, earY, earR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fda4af';
      ctx.beginPath();
      ctx.arc(earX, -earY, earR * 0.62, 0, Math.PI * 2);
      ctx.arc(earX, earY, earR * 0.62, 0, Math.PI * 2);
      ctx.fill();

      if (isMother) {
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.moveTo(earX, 0); ctx.lineTo(earX - radius * 0.22, -radius * 0.28); ctx.lineTo(earX + radius * 0.22, -radius * 0.28); ctx.closePath();
        ctx.moveTo(earX, 0); ctx.lineTo(earX - radius * 0.22, radius * 0.28); ctx.lineTo(earX + radius * 0.22, radius * 0.28); ctx.closePath();
        ctx.fill();
      }

      // Expressive Eyes + Blink
      const blink = (performance.now() % 3400) < 110;
      ctx.fillStyle = '#0f172a';
      if (!blink) {
        ctx.beginPath();
        ctx.arc(radius * 0.52, -radius * 0.22, radius * 0.13, 0, Math.PI * 2);
        ctx.arc(radius * 0.52, radius * 0.22, radius * 0.13, 0, Math.PI * 2);
        ctx.fill();
      }

      // Pink Nose & Whiskers
      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.arc(radius * 1.02, 0, radius * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(radius * 0.85, -radius * 0.1); ctx.lineTo(radius * 1.15, -radius * 0.55);
      ctx.moveTo(radius * 0.85, -radius * 0.05); ctx.lineTo(radius * 1.22, -radius * 0.28);
      ctx.moveTo(radius * 0.85, radius * 0.1); ctx.lineTo(radius * 1.15, radius * 0.55);
      ctx.moveTo(radius * 0.85, radius * 0.05); ctx.lineTo(radius * 1.22, radius * 0.28);
      ctx.stroke();

      ctx.restore();
    }

    function drawArticulatedCat(ctx, x, y, radius, cat) {
      ctx.save();
      ctx.translate(x, y);

      // Ground contact shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
      ctx.beginPath();
      ctx.ellipse(2, 5, radius * 1.05, radius * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.44, 0, Math.PI * 2);
      ctx.fillStyle = cat.alerted ? 'rgba(244, 63, 94, 0.34)' : 'rgba(244, 63, 94, 0.16)';
      ctx.fill();

      ctx.save();
      ctx.rotate(cat.visualAngle);
      const stride = Math.sin(cat.stridePhase);
      ctx.rotate(Math.cos(cat.stridePhase) * 0.08);
      const pal = cat.palette;

      // S-Curved Tail
      const tailWag = Math.sin(cat.stridePhase * 0.8) * radius * 0.65;
      ctx.beginPath();
      ctx.moveTo(-radius * 0.85, 0);
      ctx.bezierCurveTo(-radius * 1.4, tailWag, -radius * 1.75, -tailWag, -radius * 2.15, tailWag * 0.5);
      ctx.strokeStyle = pal.body;
      ctx.lineWidth = Math.max(3, radius * 0.28);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-radius * 2.12, tailWag * 0.48, radius * 0.16, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();

      // 4 White-Gloved Paws
      const pawOffset = stride * radius * 0.42;
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = pal.stripe;
      ctx.lineWidth = 1.2;
      const drawPaw = (px, py) => {
        ctx.beginPath();
        ctx.ellipse(px, py, radius * 0.28, radius * 0.20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      };
      drawPaw(radius * 0.55 + pawOffset, -radius * 0.58);
      drawPaw(radius * 0.55 - pawOffset, radius * 0.58);
      drawPaw(-radius * 0.48 - pawOffset, -radius * 0.55);
      drawPaw(-radius * 0.48 + pawOffset, radius * 0.55);

      // Torso + Tabby Stripes
      ctx.fillStyle = pal.body;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-radius * 0.12, 0, radius * 0.92, radius * 0.54, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = pal.stripe;
      ctx.lineWidth = Math.max(1.8, radius * 0.14);
      [-0.45, -0.15, 0.15].forEach(off => {
        ctx.beginPath();
        ctx.moveTo(radius * off, -radius * 0.42);
        ctx.lineTo(radius * (off - 0.08), radius * 0.42);
        ctx.stroke();
      });

      // Head + Pointed Ears
      ctx.fillStyle = pal.body;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(radius * 0.52, 0, radius * 0.58, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      [-1, 1].forEach(signY => {
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.moveTo(radius * 0.35, signY * radius * 0.35);
        ctx.lineTo(radius * 0.15, signY * radius * 0.98);
        ctx.lineTo(radius * 0.72, signY * radius * 0.52);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = pal.earInner;
        ctx.beginPath();
        ctx.moveTo(radius * 0.38, signY * radius * 0.42);
        ctx.lineTo(radius * 0.24, signY * radius * 0.84);
        ctx.lineTo(radius * 0.62, signY * radius * 0.50);
        ctx.closePath();
        ctx.fill();
      });

      // Fierce Slit Eyes (Glow fiery amber-red when alerted!)
      ctx.fillStyle = cat.alerted ? '#fb7185' : '#fde047';
      ctx.beginPath();
      ctx.ellipse(radius * 0.72, -radius * 0.24, radius * 0.16, radius * 0.22, 0.2, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.72, radius * 0.24, radius * 0.16, radius * 0.22, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(radius * 0.76, -radius * 0.24, radius * 0.06, radius * 0.18, 0, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.76, radius * 0.24, radius * 0.06, radius * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Muzzle, Nose & Whiskers
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(radius * 0.95, -radius * 0.11, radius * 0.14, 0, Math.PI * 2);
      ctx.arc(radius * 0.95, radius * 0.11, radius * 0.14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(radius * 1.04, 0, radius * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(radius * 0.92, -radius * 0.18); ctx.lineTo(radius * 1.15, -radius * 0.72);
      ctx.moveTo(radius * 0.95, -radius * 0.12); ctx.lineTo(radius * 1.25, -radius * 0.42);
      ctx.moveTo(radius * 0.92, radius * 0.18); ctx.lineTo(radius * 1.15, radius * 0.72);
      ctx.moveTo(radius * 0.95, radius * 0.12); ctx.lineTo(radius * 1.25, radius * 0.42);
      ctx.stroke();
      ctx.restore();

      // Alert Exclamation Bubble above cat when chasing closely
      if (cat.alerted) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(0, -radius * 1.65, radius * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${Math.max(10, Math.floor(radius * 0.65))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, -radius * 1.63);
      }

      ctx.restore();
    }

    function drawHeavenAscension(ctx, x, y, radius, progress) {
      ctx.save();
      const floatUpY = y - progress * 115;
      const swayX = x + Math.sin(progress * Math.PI * 5) * 14;
      const alpha = Math.max(0, 1 - Math.pow(progress, 2.2));

      const beamGrad = ctx.createLinearGradient(swayX, floatUpY - 140, swayX, y + 30);
      beamGrad.addColorStop(0, `rgba(253, 224, 71, ${0.55 * alpha})`);
      beamGrad.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(swayX - radius * 2.4, floatUpY - 140);
      ctx.lineTo(swayX + radius * 2.4, floatUpY - 140);
      ctx.lineTo(swayX + radius * 1.3, y + 25);
      ctx.lineTo(swayX - radius * 1.3, y + 25);
      ctx.closePath();
      ctx.fill();

      ctx.translate(swayX, floatUpY);
      ctx.globalAlpha = alpha;

      const wingFlap = Math.sin(progress * Math.PI * 14) * 0.45;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 1.8;

      [-1, 1].forEach(sign => {
        ctx.save();
        ctx.rotate(sign * (0.35 - wingFlap));
        ctx.beginPath();
        ctx.ellipse(sign * radius * 1.15, 0, radius * 0.95, radius * 0.45, sign * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      ctx.fillStyle = '#fef9c3';
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-radius * 0.65, -radius * 0.65, radius * 0.42, 0, Math.PI * 2);
      ctx.arc(radius * 0.65, -radius * 0.65, radius * 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(-radius * 0.28, -radius * 0.1, radius * 0.16, Math.PI, 0);
      ctx.moveTo(radius * 0.12, -radius * 0.1);
      ctx.arc(radius * 0.28, -radius * 0.1, radius * 0.16, Math.PI, 0);
      ctx.stroke();

      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, -radius * 1.35, radius * 0.72, radius * 0.22, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function renderMazeFrame() {
      const { width, height } = gameState.canvasSize;
      if (!width || !height || !gameState.grid.length) return;
      if (gameState.mazeCache.dirty) rebuildStaticMazeCache();

      const spec = LEVELS[gameState.currentLevelIdx];
      const { player, babies, cats, exitCell, camera, mazeCache, virtualStick } = gameState;
      const rows = spec.rows, cols = spec.cols;

      ctx.clearRect(0, 0, width, height);

      const visibleSpan = Math.max(8, camera.visibleSpan);
      const cellSize = Math.min(width, height) / visibleSpan;
      const halfSpanR = (height / cellSize) / 2;
      const halfSpanC = (width / cellSize) / 2;

      let camR = camera.r + 0.5, camC = camera.c + 0.5;
      camR = rows > halfSpanR * 2 ? Math.max(halfSpanR, Math.min(rows - halfSpanR, camR)) : rows / 2;
      camC = cols > halfSpanC * 2 ? Math.max(halfSpanC, Math.min(cols - halfSpanC, camC)) : cols / 2;

      const offsetX = width / 2 - camC * cellSize;
      const offsetY = height / 2 - camR * cellSize;

      // 1. Blit pre-rendered architectural maze
      ctx.drawImage(mazeCache.canvas, 0, 0, mazeCache.canvas.width, mazeCache.canvas.height, offsetX, offsetY, cols * cellSize, rows * cellSize);

      // 2. Guide Overlay (Strictly Levels 1–3 when toggled ON)
      if (isGuideAllowedForCurrentLevel() && gameState.showBFSOverlay && gameState.bfsPathsToTargets.length > 0) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        gameState.bfsPathsToTargets.forEach(pathObj => {
          const pts = pathObj.points;
          if (pts.length < 2) return;
          ctx.beginPath();
          pts.forEach(([pr, pc], i) => {
            const vx = offsetX + (pc + 0.5) * cellSize;
            const vy = offsetY + (pr + 0.5) * cellSize;
            if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
          });
          ctx.strokeStyle = pathObj.type === 'exit' ? 'rgba(52, 211, 153, 0.84)' : 'rgba(250, 204, 21, 0.8)';
          ctx.lineWidth = Math.max(3, cellSize * 0.15);
          ctx.setLineDash([6, 6]);
          ctx.stroke();
        });
        ctx.restore();
      }

      const now = performance.now();

      // 3. Exit Portal with pulsing glow when unlocked
      const exX = offsetX + (exitCell.c + 0.5) * cellSize;
      const exY = offsetY + (exitCell.r + 0.5) * cellSize;
      ctx.save();
      if (exitCell.unlocked) {
        const pulse = 1 + Math.sin(now * 0.008) * 0.15;
        ctx.beginPath();
        ctx.arc(exX, exY, cellSize * 0.56 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(16, 185, 129, 0.28)';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(exX, exY, cellSize * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = exitCell.unlocked ? '#10b981' : 'rgba(255,255,255,0.22)';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = exitCell.unlocked ? '#a7f3d0' : spec.contrastHex;
      ctx.stroke();
      ctx.font = `${Math.floor(cellSize * 0.42)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(exitCell.unlocked ? '🚪' : '🧀', exX, exY);
      ctx.restore();

      // 4. World FX Particles (dust & rescue sparkles)
      gameState.fxParticles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(offsetX + (pt.c + 0.5) * cellSize, offsetY + (pt.r + 0.5) * cellSize, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 5. Unrescued Baby Mice
      babies.forEach(b => {
        if (b.rescued) return;
        const bx = offsetX + (b.c + 0.5) * cellSize;
        const by = offsetY + (b.r + 0.5) * cellSize + Math.sin(now / 200 + b.bobPhase) * (cellSize * 0.06);
        drawArticulatedMouse(ctx, bx, by, cellSize * 0.28, Math.sin(now / 450 + b.bobPhase) * 0.5, now / 120 + b.bobPhase, false, spec.contrastHex, 0, false);
      });

      // 6. Rescued Baby Mice Trail
      const rescuedBabies = babies.filter(b => b.rescued);
      rescuedBabies.forEach((b, i) => {
        const idxTrail = Math.min((i + 1) * 2, gameState.rescuedTrail.length - 1);
        const tp = gameState.rescuedTrail[idxTrail] || player;
        drawArticulatedMouse(ctx, offsetX + (tp.c + 0.5) * cellSize, offsetY + (tp.r + 0.5) * cellSize, cellSize * 0.24, tp.angle || 0, player.walkPhase - i, false, spec.contrastHex, 0);
      });

      // 7. Patrol Cats
      cats.forEach(cat => {
        drawArticulatedCat(ctx, offsetX + (cat.c + 0.5) * cellSize, offsetY + (cat.r + 0.5) * cellSize, cellSize * 0.39, cat);
      });

      // 8. Mother Mouse or 2-Second Heaven Ascension
      const px = offsetX + (player.c + 0.5) * cellSize;
      const py = offsetY + (player.r + 0.5) * cellSize;
      if (gameState.status === 'dying_heaven' && gameState.deathAnim.active) {
        const progress = Math.min(1, (now - gameState.deathAnim.startTime) / gameState.deathAnim.duration);
        drawHeavenAscension(ctx, px, py, cellSize * 0.42, progress);
      } else {
        const shieldRem = Math.max(0, (gameState.shieldUntil - Date.now()) / 3000);
        drawArticulatedMouse(ctx, px, py, cellSize * 0.38, player.visualAngle, player.walkPhase, true, spec.contrastHex, shieldRem);
      }

      // 9. Floating Score Popups
      gameState.floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.font = '900 13px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        const fx = offsetX + (ft.c + 0.5) * cellSize;
        const fy = offsetY + (ft.r + 0.5) * cellSize - 10;
        ctx.strokeText(ft.text, fx, fy);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, fx, fy);
        ctx.restore();
      });

      // 10. Floating Canvas Stick Ring
      if (virtualStick.active && gameState.status === 'playing') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(virtualStick.originX, virtualStick.originY, 34, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.stroke();

        const dx = virtualStick.currX - virtualStick.originX;
        const dy = virtualStick.currY - virtualStick.originY;
        const dist = Math.min(26, Math.hypot(dx, dy));
        const ang = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.arc(virtualStick.originX + Math.cos(ang) * dist, virtualStick.originY + Math.sin(ang) * dist, 14, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.restore();
      }

      // 11. Corner Radar Minimap
      drawFastCornerMinimap(width, height, spec);

      // 12. Deluxe All-Clear Firecracker Celebration
      if (gameState.status === 'all_clear_celebration') {
        drawFirecrackerCelebration(ctx);
      }
    }

    function drawFastCornerMinimap(canvasW, canvasH, spec) {
      const mapSize = 60, pad = 6;
      const mx = canvasW - mapSize - pad, my = pad;
      ctx.drawImage(gameState.mazeCache.minimapCanvas, mx, my);

      const scale = (mapSize - 8) / Math.max(spec.cols, spec.rows);
      const ox = mx + 4, oy = my + 4;
      ctx.save();
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(ox + (gameState.exitCell.c + 0.5) * scale, oy + (gameState.exitCell.r + 0.5) * scale, 2.5, 0, Math.PI * 2);
      ctx.fill();

      if (isGuideAllowedForCurrentLevel() && gameState.showBFSOverlay) {
        ctx.fillStyle = '#fde047';
        gameState.babies.forEach(b => {
          if (!b.rescued) {
            ctx.beginPath();
            ctx.arc(ox + (b.c + 0.5) * scale, oy + (b.r + 0.5) * scale, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      ctx.fillStyle = '#f43f5e';
      gameState.cats.forEach(cat => {
        ctx.beginPath();
        ctx.arc(ox + (cat.c + 0.5) * scale, oy + (cat.r + 0.5) * scale, 2.2, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = spec.contrastHex;
      ctx.beginPath();
      ctx.arc(ox + (gameState.player.c + 0.5) * scale, oy + (gameState.player.r + 0.5) * scale, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================
    // 11. STRICT 4-WAY CARDINAL CONTROLS (RIGHT D-PAD, CANVAS STICK, KEYBOARD)
    // =========================================================================
    function highlightActiveDpadButton(dirCode, nubDx = 0, nubDy = 0) {
      const map = { U: 'dpad-up', D: 'dpad-down', L: 'dpad-left', R: 'dpad-right' };
      ['U', 'D', 'L', 'R'].forEach(k => {
        const el = document.getElementById(map[k]);
        if (el) {
          if (k === dirCode) el.classList.add('dpad-btn-active');
          else el.classList.remove('dpad-btn-active');
        }
      });
      const nub = document.getElementById('dpad-nub');
      if (nub) nub.style.transform = `translate(${nubDx}px, ${nubDy}px)`;
    }

    function setDirectDpadDirection(dirCode, nubDx = 0, nubDy = 0) {
      if (gameState.status !== 'playing' && dirCode !== null) return;
      if (!sound.ctx && dirCode) {
        sound.init();
        if (gameState.status === 'playing') sound.startChaseBGM();
      }
      highlightActiveDpadButton(dirCode, nubDx, nubDy);

      const codeToVec = (c) => {
        if (c === 'U') return { dr: -1, dc: 0 };
        if (c === 'D') return { dr: 1, dc: 0 };
        if (c === 'L') return { dr: 0, dc: -1 };
        if (c === 'R') return { dr: 0, dc: 1 };
        return null;
      };

      const vec = codeToVec(dirCode);
      const p = gameState.player;
      const dirChanged = !p.heldDir || !vec || p.heldDir.dr !== vec.dr || p.heldDir.dc !== vec.dc;
      p.heldDir = vec;
      if (!vec || gameState.status !== 'playing') return;

      // Instant 180-degree reversal mid-corridor
      if ((p.moveDir.dr !== 0 || p.moveDir.dc !== 0) && vec.dr === -p.moveDir.dr && vec.dc === -p.moveDir.dc) {
        const oldTR = p.targetR, oldTC = p.targetC;
        p.targetR = p.fromR; p.targetC = p.fromC;
        p.fromR = oldTR; p.fromC = oldTC;
        p.moveDir = { dr: vec.dr, dc: vec.dc };
        p.angle = Math.atan2(vec.dr, vec.dc);
        p.bufferedDir = null;
        return;
      }

      // Perpendicular turn buffering (280ms window) + early-cell snap turn (only on fresh dir change)
      if (p.moveDir.dr !== 0 || p.moveDir.dc !== 0) {
        if (vec.dr !== p.moveDir.dr || vec.dc !== p.moveDir.dc) {
          const distFromOrigin = Math.hypot(p.r - p.fromR, p.c - p.fromC);
          if (dirChanged && distFromOrigin < 0.22 && canMoveFromCell(p.fromR, p.fromC, vec.dr, vec.dc)) {
            p.r = p.fromR; p.c = p.fromC;
            p.targetR = p.fromR + vec.dr; p.targetC = p.fromC + vec.dc;
            p.moveDir = { dr: vec.dr, dc: vec.dc };
            p.angle = Math.atan2(vec.dr, vec.dc);
            p.bufferedDir = null;
          } else {
            p.bufferedDir = { dr: vec.dr, dc: vec.dc };
            p.bufferedAt = Date.now();
          }
        }
      }
    }

    function bindControls() {
      document.getElementById('btn-StartFromHome').addEventListener('click', closeHomeMenuAndPlay);
      document.getElementById('btn-ReturnHome').addEventListener('click', openHomeMenuScreen);

      const toggleAudio = () => {
        sound.bgmEnabled = !sound.bgmEnabled;
        document.getElementById('bgm-icon').textContent = sound.bgmEnabled ? '🔊' : '🔇';
        renderHomeMenuUI();
        if (sound.bgmEnabled && gameState.status === 'playing') sound.startChaseBGM();
        else sound.stopChaseBGM();
      };
      document.getElementById('btn-HomeToggleAudio').addEventListener('click', toggleAudio);
      document.getElementById('btn-ToggleBGM').addEventListener('click', toggleAudio);

      document.getElementById('home-slider-cam').addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        gameState.camera.visibleSpan = Math.max(8, val);
        document.getElementById('home-cam-label').textContent = `${val}×${val}`;
        renderMazeFrame();
      });

      document.getElementById('btn-Pause').addEventListener('click', togglePause);
      document.getElementById('btn-Restart').addEventListener('click', () => loadLevel(gameState.currentLevelIdx, true, true));

      document.getElementById('btn-ToggleBFS').addEventListener('click', () => {
        if (!isGuideAllowedForCurrentLevel()) return;
        gameState.showBFSOverlay = !gameState.showBFSOverlay;
        updatePlayerBFS(true);
        updateFullLevelUI();
        renderMazeFrame();
      });

      document.getElementById('canvas-overlay').addEventListener('pointerdown', (e) => {
        if (gameState.status === 'all_clear_celebration' && e.target.id === 'canvas-overlay') {
          const rect = document.getElementById('canvas-wrapper').getBoundingClientRect();
          spawnFirecrackerBurst(e.clientX - rect.left, e.clientY - rect.top, 46, true);
          sound.playBigFireworkBoom(0);
        }
      });

      // Right-Side Strict 4-Way D-Pad
      const dpadContainer = document.getElementById('dpad-pad');
      let dpadPointerId = null;
      let dpadCenter = { x: 0, y: 0 };

      const updateDpadFromPointer = (clientX, clientY) => {
        if (gameState.status !== 'playing') return;
        const dx = clientX - dpadCenter.x;
        const dy = clientY - dpadCenter.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 8) { setDirectDpadDirection(null, 0, 0); return; }
        const clampDist = Math.min(14, dist * 0.32);
        const ang = Math.atan2(dy, dx);
        const cur = gameState.player.heldDir;
        let code;
        if (cur && cur.dc !== 0) {
          code = Math.abs(dy) > Math.abs(dx) * 1.18 ? (dy > 0 ? 'D' : 'U') : (dx >= 0 ? 'R' : 'L');
        } else if (cur && cur.dr !== 0) {
          code = Math.abs(dx) > Math.abs(dy) * 1.18 ? (dx > 0 ? 'R' : 'L') : (dy >= 0 ? 'D' : 'U');
        } else {
          code = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
        }
        setDirectDpadDirection(code, Math.cos(ang) * clampDist, Math.sin(ang) * clampDist);
      };

      dpadContainer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState.status !== 'playing') return;
        const rect = dpadContainer.getBoundingClientRect();
        dpadCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        dpadPointerId = e.pointerId;
        if (dpadContainer.setPointerCapture) {
          try { dpadContainer.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateDpadFromPointer(e.clientX, e.clientY);
      });

      dpadContainer.addEventListener('pointermove', (e) => {
        if (dpadPointerId !== e.pointerId) return;
        e.preventDefault();
        updateDpadFromPointer(e.clientX, e.clientY);
      });

      const stopDpad = (e) => {
        if (dpadPointerId !== null && e.pointerId !== undefined && dpadPointerId !== e.pointerId) return;
        dpadPointerId = null;
        setDirectDpadDirection(null, 0, 0);
      };
      dpadContainer.addEventListener('pointerup', stopDpad);
      dpadContainer.addEventListener('pointercancel', stopDpad);

      // Canvas Floating 4-Way Stick
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState.status !== 'playing') return;
        if (!sound.ctx) { sound.init(); sound.startChaseBGM(); }
        const rect = document.getElementById('canvas-wrapper').getBoundingClientRect();
        gameState.canvasSize = { width: rect.width, height: rect.height, left: rect.left, top: rect.top };
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
        const lx = e.clientX - rect.left, ly = e.clientY - rect.top;
        gameState.virtualStick = { active: true, pointerId: e.pointerId, originX: lx, originY: ly, currX: lx, currY: ly };
      });

      canvas.addEventListener('pointermove', (e) => {
        const vs = gameState.virtualStick;
        if (!vs.active || vs.pointerId !== e.pointerId) return;
        e.preventDefault();
        vs.currX = e.clientX - gameState.canvasSize.left;
        vs.currY = e.clientY - gameState.canvasSize.top;
        const dx = vs.currX - vs.originX, dy = vs.currY - vs.originY;
        const dist = Math.hypot(dx, dy);
        if (dist < 10) { setDirectDpadDirection(null, 0, 0); return; }
        if (dist > 34) {
          const ang = Math.atan2(dy, dx);
          vs.originX = vs.currX - Math.cos(ang) * 28;
          vs.originY = vs.currY - Math.sin(ang) * 28;
        }
        const cur = gameState.player.heldDir;
        let code;
        if (cur && cur.dc !== 0) {
          code = Math.abs(dy) > Math.abs(dx) * 1.18 ? (dy > 0 ? 'D' : 'U') : (dx >= 0 ? 'R' : 'L');
        } else if (cur && cur.dr !== 0) {
          code = Math.abs(dx) > Math.abs(dy) * 1.18 ? (dx > 0 ? 'R' : 'L') : (dy >= 0 ? 'D' : 'U');
        } else {
          code = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
        }
        setDirectDpadDirection(code, 0, 0);
      });

      const endCanvasStick = () => {
        if (gameState.virtualStick.active) {
          gameState.virtualStick.active = false;
          gameState.virtualStick.pointerId = null;
          setDirectDpadDirection(null, 0, 0);
        }
      };
      canvas.addEventListener('pointerup', endCanvasStick);
      canvas.addEventListener('pointercancel', endCanvasStick);

      // Keyboard Controls
      const heldDirs = [];
      const keyToCode = (k) => {
        if (k === 'ArrowUp' || k === 'w' || k === 'W') return 'U';
        if (k === 'ArrowDown' || k === 's' || k === 'S') return 'D';
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') return 'L';
        if (k === 'ArrowRight' || k === 'd' || k === 'D') return 'R';
        return null;
      };

      window.addEventListener('keydown', (e) => {
        if (gameState.status !== 'playing') return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        const code = keyToCode(e.key);
        if (code) {
          const idx = heldDirs.indexOf(code);
          if (idx !== -1) heldDirs.splice(idx, 1);
          heldDirs.push(code);
          setDirectDpadDirection(code, 0, 0);
        }
      });

      window.addEventListener('keyup', (e) => {
        const code = keyToCode(e.key);
        if (code) {
          const idx = heldDirs.indexOf(code);
          if (idx !== -1) heldDirs.splice(idx, 1);
          setDirectDpadDirection(heldDirs.length > 0 ? heldDirs[heldDirs.length - 1] : null, 0, 0);
        }
      });

      window.addEventListener('blur', () => {
        heldDirs.length = 0;
        setDirectDpadDirection(null, 0, 0);
      });

      window.addEventListener('resize', resizeCanvas);
    }

    window.onload = () => {
      bindControls();
      loadLevel(0, false, true);
      openHomeMenuScreen();
      setTimeout(resizeCanvas, 40);
    };
  </script>
</body>
</html>
