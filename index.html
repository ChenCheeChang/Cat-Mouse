    // =========================================================================
    // 9. DELUXE 4-STRING HANGING FIRECRACKER & FIREWORKS CELEBRATION (LEVEL 20)
    // =========================================================================
    function spawnFirecrackerBurst(x, y, count = 42, isGold = false) {
      const cel = gameState.celebration;
      const colors = isGold
        ? ['#fde047', '#facc15', '#ffffff', '#fb923c', '#ef4444']
        : ['#ef4444', '#fde047', '#fb923c', '#ffffff', '#38bdf8', '#f472b6'];
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 70 + Math.random() * 210;
        cel.particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 35,
          size: 2.2 + Math.random() * 3.4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0.75 + Math.random() * 0.65,
          maxLife: 1.4
        });
      }
      cel.shockwaves.push({ x, y, radius: 6, maxRadius: 72 + Math.random() * 45, alpha: 0.9, color: isGold ? '#fde047' : '#fb7185' });
      cel.shake = Math.max(cel.shake, isGold ? 6.5 : 4.0);
      cel.flashAlpha = Math.max(cel.flashAlpha, isGold ? 0.28 : 0.14);
    }

    function launchFireworkRocket() {
      const w = gameState.canvasSize.width || 340;
      const h = gameState.canvasSize.height || 340;
      gameState.celebration.rockets.push({
        x: w * (0.16 + Math.random() * 0.68),
        y: h + 10,
        vx: (Math.random() - 0.5) * 45,
        vy: -(240 + Math.random() * 140),
        targetY: h * (0.16 + Math.random() * 0.34),
        color: ['#fde047', '#ef4444', '#38bdf8', '#f472b6', '#34d399'][Math.floor(Math.random() * 5)]
      });
    }

    function triggerAllClearFirecrackerCelebration() {
      stopLoops();
      gameState.hasActiveSession = false;
      gameState.status = 'all_clear_celebration';
      sound.stopChaseBGM();
      sound.playDeluxeFirecrackerSalute();

      const w = gameState.canvasSize.width || 340;
      const h = gameState.canvasSize.height || 340;
      const cel = gameState.celebration;
      cel.active = true;
      cel.startTime = performance.now();
      cel.lastVolleyTime = performance.now();
      cel.particles = [];
      cel.confetti = [];
      cel.rockets = [];
      cel.shockwaves = [];
      cel.shake = 6;
      cel.flashAlpha = 0.32;

      // 4 Hanging Red-Gold Lantern Firecracker Strings
      cel.strings = [0.14, 0.34, 0.66, 0.86].map((xr, idx) => ({
        x: w * xr,
        topY: 16,
        crackers: Array.from({ length: 14 }, (_, k) => ({
          dy: 32 + k * 14,
          side: k % 2 === 0 ? -1 : 1,
          exploded: false,
          fuseAt: (13 - k) * 0.14 + idx * 0.08
        }))
      }));

      for (let i = 0; i < 65; i++) {
        cel.confetti.push({
          x: Math.random() * w,
          y: -Math.random() * h * 0.8,
          vx: (Math.random() - 0.5) * 50,
          vy: 55 + Math.random() * 90,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 8,
          w: 6 + Math.random() * 5,
          h: 3 + Math.random() * 3,
          color: ['#ef4444', '#facc15', '#fde047', '#ffffff', '#fb923c'][i % 5]
        });
      }

      launchFireworkRocket();
      launchFireworkRocket();

      showOverlayBox(
        '🧨',
        `恭喜全 ${LEVELS.length} 關破關！`,
        `總分 ${gameState.score} · 點擊畫面可隨時加放煙火！`,
        '從第 1 關再挑戰',
        () => {
          gameState.continuesLeft.fill(10);
          gameState.score = 0;
          loadLevel(0, true, true);
        },
        '返回選項首頁',
        openHomeMenuScreen
      );

      gameState.lastFrameTime = performance.now();
      const loopCel = (now) => {
        if (gameState.status !== 'all_clear_celebration') return;
        const dt = Math.min(0.05, Math.max(0.004, (now - gameState.lastFrameTime) / 1000));
        gameState.lastFrameTime = now;
        updateFirecrackerCelebration(dt);
        renderFrame();
        gameState.rafId = requestAnimationFrame(loopCel);
      };
      gameState.rafId = requestAnimationFrame(loopCel);
    }

    function updateFirecrackerCelebration(dt) {
      const cel = gameState.celebration;
      const elapsed = (performance.now() - cel.startTime) / 1000;
      const w = gameState.canvasSize.width || 340;
      const h = gameState.canvasSize.height || 340;

      cel.shake = Math.max(0, cel.shake - dt * 14);
      cel.flashAlpha = Math.max(0, cel.flashAlpha - dt * 1.4);

      cel.strings.forEach(str => {
        str.crackers.forEach(cr => {
          if (!cr.exploded && elapsed >= cr.fuseAt) {
            cr.exploded = true;
            spawnFirecrackerBurst(str.x + cr.side * 9, str.topY + cr.dy, 16, false);
          }
        });
      });

      if (performance.now() - cel.lastVolleyTime > 950) {
        cel.lastVolleyTime = performance.now();
        launchFireworkRocket();
      }

      for (let i = cel.rockets.length - 1; i >= 0; i--) {
        const r = cel.rockets[i];
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        if (r.y <= r.targetY) {
          spawnFirecrackerBurst(r.x, r.y, 48, true);
          sound.playBigFireworkBoom(0);
          cel.rockets.splice(i, 1);
        }
      }

      for (let i = cel.particles.length - 1; i >= 0; i--) {
        const p = cel.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 190 * dt;
        p.life -= dt;
        if (p.life <= 0) cel.particles.splice(i, 1);
      }

      for (let i = cel.shockwaves.length - 1; i >= 0; i--) {
        const s = cel.shockwaves[i];
        s.radius += 190 * dt;
        s.alpha -= 1.8 * dt;
        if (s.alpha <= 0 || s.radius >= s.maxRadius) cel.shockwaves.splice(i, 1);
      }

      cel.confetti.forEach(c => {
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.rot += c.vrot * dt;
        if (c.y > h + 15) { c.y = -12; c.x = Math.random() * w; }
      });
    }

    function drawFirecrackerCelebration(ctx, w, h) {
      const cel = gameState.celebration;
      ctx.save();
      if (cel.shake > 0.2) {
        ctx.translate((Math.random() - 0.5) * cel.shake, (Math.random() - 0.5) * cel.shake);
      }

      if (cel.flashAlpha > 0.01) {
        ctx.fillStyle = `rgba(254, 240, 138, ${cel.flashAlpha})`;
        ctx.fillRect(0, 0, w, h);
      }

      // 4 Hanging Red-Gold Lantern Firecracker Strings
      cel.strings.forEach(str => {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(str.x, 0);
        ctx.lineTo(str.x, str.topY + 26);
        ctx.stroke();

        // Top Red-Gold Lantern
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.ellipse(str.x, str.topY + 12, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        str.crackers.forEach(cr => {
          if (cr.exploded) return;
          ctx.save();
          ctx.translate(str.x + cr.side * 9, str.topY + cr.dy);
          ctx.rotate(cr.side * 0.45);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-3.5, -7, 7, 14);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-3.5, -7, 7, 2.6);
          ctx.fillRect(-3.5, 4.4, 7, 2.6);
          ctx.restore();
        });
      });

      cel.rockets.forEach(r => {
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      });

      cel.shockwaves.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;

      cel.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      cel.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      });

      ctx.restore();
    }

    // =========================================================================
    // 10. MAIN GAME LOOP, STRICT GRID-RAIL 4-WAY PHYSICS & MODERATE 3D DIFFICULTY
    // =========================================================================
    function startGameplay() {
      stopLoops();
      hideOverlay();
      gameState.status = 'playing';
      gameState.hasActiveSession = true;
      if (Date.now() > gameState.shieldUntil) {
        gameState.shieldUntil = Date.now() + 3000;
      }
      document.getElementById('pause-icon').textContent = '⏸';
      document.getElementById('island-status').textContent = '3D 迷宮進行中';
      document.getElementById('danger-led').className = 'w-2 h-2 rounded-full bg-emerald-400';

      sound.init();
      sound.startChaseBGM();

      gameState.lastFrameTime = performance.now();
      const loop = (now) => {
        if (gameState.status === 'playing') {
          const dt = Math.min(0.05, Math.max(0.004, (now - gameState.lastFrameTime) / 1000));
          gameState.lastFrameTime = now;
          updateSmoothEntities(dt);
          checkSmoothPlayerInteractions();
          renderFrame();
          if (gameState.status === 'playing') {
            gameState.rafId = requestAnimationFrame(loop);
          }
        } else if (gameState.status === 'dying_heaven') {
          updateDeathHeavenAnimation();
          renderFrame();
          if (gameState.status === 'dying_heaven') {
            gameState.rafId = requestAnimationFrame(loop);
          }
        }
      };
      gameState.rafId = requestAnimationFrame(loop);
    }

    function stopLoops() {
      if (gameState.rafId) {
        cancelAnimationFrame(gameState.rafId);
        gameState.rafId = null;
      }
    }

    function togglePause() {
      if (gameState.status === 'playing') {
        stopLoops();
        gameState.status = 'paused';
        gameState.virtualStick.active = false;
        highlightActiveDpadButton(null, 0, 0);
        sound.stopChaseBGM();
        document.getElementById('pause-icon').textContent = '▶️';
        showOverlayBox('⏸️', '遊戲暫停', '隨時可以繼續或返回首頁。', '繼續遊戲', togglePause, '返回選項首頁', openHomeMenuScreen);
      } else if (gameState.status === 'paused') {
        startGameplay();
      }
    }

    function canMoveFromCell(r, c, dr, dc) {
      if (dr === 0 && dc === 0) return false;
      const cell = gameState.grid[r] && gameState.grid[r][c];
      if (!cell || !cell.valid) return false;
      if (dr === -1 && cell.walls.top) return false;
      if (dr === 1 && cell.walls.bottom) return false;
      if (dc === -1 && cell.walls.left) return false;
      if (dc === 1 && cell.walls.right) return false;
      const nr = r + dr, nc = c + dc;
      return !!(gameState.grid[nr] && gameState.grid[nr][nc] && gameState.grid[nr][nc].valid);
    }

    function updateSmoothEntities(dt) {
      const p = gameState.player;
      const nowMs = Date.now();
      const playerSpeed = 5.4; // Crisp, responsive speed for fair no-dash 3D play
      let remaining = playerSpeed * dt;
      let movedAny = false;

      if (p.bufferedDir && nowMs - p.bufferedAt > 280) {
        p.bufferedDir = null;
      }

      while (remaining > 0.0001) {
        const isMoving = p.moveDir.dr !== 0 || p.moveDir.dc !== 0;

        // Instant 180-degree mid-corridor reversal
        if (isMoving && p.heldDir && p.heldDir.dr === -p.moveDir.dr && p.heldDir.dc === -p.moveDir.dc) {
          const oldTR = p.targetR, oldTC = p.targetC;
          p.targetR = p.fromR; p.targetC = p.fromC;
          p.fromR = oldTR; p.fromC = oldTC;
          p.moveDir = { dr: p.heldDir.dr, dc: p.heldDir.dc };
          p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
          p.bufferedDir = null;
        }

        if (!isMoving) {
          const wantDir = p.heldDir || p.bufferedDir;
          if (wantDir && canMoveFromCell(p.r, p.c, wantDir.dr, wantDir.dc)) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + wantDir.dr;
            p.targetC = p.c + wantDir.dc;
            p.moveDir = { dr: wantDir.dr, dc: wantDir.dc };
            p.angle = Math.atan2(wantDir.dr, wantDir.dc);
            if (p.bufferedDir && p.bufferedDir.dr === wantDir.dr && p.bufferedDir.dc === wantDir.dc) {
              p.bufferedDir = null;
            }
          } else {
            break;
          }
        }

        const distToTarget = Math.hypot(p.targetR - p.r, p.targetC - p.c);
        if (remaining < distToTarget) {
          p.r += p.moveDir.dr * remaining;
          p.c += p.moveDir.dc * remaining;
          p.walkPhase += remaining * 12;
          remaining = 0;
          movedAny = true;
        } else {
          p.r = p.targetR;
          p.c = p.targetC;
          p.walkPhase += distToTarget * 12;
          remaining -= distToTarget;
          movedAny = true;

          const validBuf = p.bufferedDir && canMoveFromCell(p.r, p.c, p.bufferedDir.dr, p.bufferedDir.dc);
          if (validBuf) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + p.bufferedDir.dr;
            p.targetC = p.c + p.bufferedDir.dc;
            p.moveDir = { dr: p.bufferedDir.dr, dc: p.bufferedDir.dc };
            p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
            p.bufferedDir = null;
          } else if (p.heldDir && canMoveFromCell(p.r, p.c, p.heldDir.dr, p.heldDir.dc)) {
            p.fromR = p.r; p.fromC = p.c;
            p.targetR = p.r + p.heldDir.dr;
            p.targetC = p.c + p.heldDir.dc;
            p.moveDir = { dr: p.heldDir.dr, dc: p.heldDir.dc };
            p.angle = Math.atan2(p.moveDir.dr, p.moveDir.dc);
          } else {
            p.moveDir = { dr: 0, dc: 0 };
            remaining = 0;
          }
        }
      }

      p.visualAngle = lerpAngle(p.visualAngle, p.angle, 1 - Math.exp(-22 * dt));

      if (movedAny) {
        gameState.stepCounter++;
        sound.playStepPluck(gameState.stepCounter);

        if (Math.random() < 0.16) {
          gameState.fxParticles.push({
            r: p.r - Math.sin(p.angle) * 0.25,
            c: p.c - Math.cos(p.angle) * 0.25,
            y: 0.10,
            vr: (Math.random() - 0.5) * 0.4,
            vc: (Math.random() - 0.5) * 0.4,
            vy: 0.5,
            life: 0.26,
            maxLife: 0.26,
            color: '#ffffff'
          });
        }

        const head = gameState.rescuedTrail[0];
        if (!head || Math.hypot(p.r - head.r, p.c - head.c) >= 0.30) {
          gameState.rescuedTrail.unshift({ r: p.r, c: p.c, angle: p.visualAngle });
          if (gameState.rescuedTrail.length > 72) gameState.rescuedTrail.pop();
        }
        updatePlayerBFS(false);
      }

      // Update world particles & floating score popups
      for (let i = gameState.fxParticles.length - 1; i >= 0; i--) {
        const pt = gameState.fxParticles[i];
        pt.r += pt.vr * dt;
        pt.c += pt.vc * dt;
        pt.y += pt.vy * dt;
        pt.vy -= 4.5 * dt;
        pt.life -= dt;
        if (pt.life <= 0) gameState.fxParticles.splice(i, 1);
      }
      for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
        const ft = gameState.floatingTexts[i];
        ft.r -= 1.0 * dt;
        ft.life -= dt;
        if (ft.life <= 0) gameState.floatingTexts.splice(i, 1);
      }

      // Smooth 3D Camera Follow
      const camLerp = 1 - Math.exp(-12 * dt);
      gameState.camera.r += (p.r - gameState.camera.r) * camLerp;
      gameState.camera.c += (p.c - gameState.camera.c) * camLerp;

      // Advance Patrol Cats (Moderate, fair no-dash 3D difficulty scaling across 20 levels)
      const lvlScale = gameState.currentLevelIdx;
      const patrolSpd = 1.95 + Math.min(0.60, lvlScale * 0.032); // L1: 1.95 -> L20: 2.55
      const chaseSpd = 2.45 + Math.min(0.70, lvlScale * 0.037);  // L1: 2.45 -> L20: 3.15
      let minCatDist = Infinity;

      gameState.cats.forEach((cat, idx) => {
        const distToPlayer = Math.hypot(cat.r - p.r, cat.c - p.c);
        if (distToPlayer < minCatDist) minCatDist = distToPlayer;
        cat.alerted = distToPlayer < 4.4 && !isPlayerProtected();

        const catSpeed = cat.alerted ? chaseSpd : patrolSpd;
        let remCat = catSpeed * dt;
        while (remCat > 0) {
          const drc = cat.targetR - cat.r;
          const dcc = cat.targetC - cat.c;
          const distC = Math.hypot(drc, dcc);
          if (distC > remCat) {
            cat.r += (drc / distC) * remCat;
            cat.c += (dcc / distC) * remCat;
            cat.stridePhase += remCat * 8;
            cat.angle = Math.atan2(drc, dcc);
            remCat = 0;
          } else {
            cat.r = cat.targetR;
            cat.c = cat.targetC;
            cat.stridePhase += distC * 8;
            remCat -= distC;
            chooseNextCatTarget(cat, idx);
            if (cat.targetR === cat.r && cat.targetC === cat.c) break;
          }
        }
        cat.visualAngle = lerpAngle(cat.visualAngle, cat.angle, 1 - Math.exp(-16 * dt));
      });

      // Proximity Tension Music & Red Vignette
      const tension = minCatDist < 6.0 ? Math.min(1, (6.0 - minCatDist) / 4.2) : 0;
      sound.setTension(tension);

      const roundedOp = Math.round(tension * 0.85 * 20) / 20;
      if (roundedOp !== gameState.lastVignetteOpacity) {
        gameState.lastVignetteOpacity = roundedOp;
        document.getElementById('tension-vignette').style.opacity = String(roundedOp);
      }

      const isDangerNow = tension > 0.35;
      if (isDangerNow !== gameState.lastTensionUIState) {
        gameState.lastTensionUIState = isDangerNow;
        const islandStatus = document.getElementById('island-status');
        const led = document.getElementById('danger-led');
        if (isDangerNow) {
          islandStatus.textContent = '⚠️ 貓咪逼近！快逃！';
          led.className = 'w-2 h-2 rounded-full bg-rose-500 animate-ping';
        } else {
          islandStatus.textContent = '3D 迷宮進行中';
          led.className = 'w-2 h-2 rounded-full bg-emerald-400';
        }
      }
    }

    function chooseNextCatTarget(cat, idx) {
      const { grid, player, playerBFSMap } = gameState;
      const cr = Math.round(cat.r), cc = Math.round(cat.c);
      const dirs = [
        { dr: -1, dc: 0, w: 'top' },
        { dr: 0, dc: 1, w: 'right' },
        { dr: 1, dc: 0, w: 'bottom' },
        { dr: 0, dc: -1, w: 'left' }
      ];
      const cell = grid[cr] && grid[cr][cc];
      if (!cell || !cell.valid) return;

      const options = [];
      for (const d of dirs) {
        if (!cell.walls[d.w]) {
          const nr = cr + d.dr, nc = cc + d.dc;
          if (grid[nr] && grid[nr][nc] && grid[nr][nc].valid) {
            options.push({ nr, nc });
          }
        }
      }
      if (!options.length) return;

      const nonBack = options.filter(o => !(o.nr === cat.lastR && o.nc === cat.lastC));
      const filtered = nonBack.length > 0 ? nonBack : options;
      let chosen;

      if (isPlayerProtected()) {
        // Cats flee while player has 3-second spawn protection shield
        filtered.sort((a, b) => Math.hypot(b.nr - player.r, b.nc - player.c) - Math.hypot(a.nr - player.r, a.nc - player.c));
        chosen = filtered[0];
      } else if (playerBFSMap && playerBFSMap[cr] && playerBFSMap[cr][cc] > 0 && playerBFSMap[cr][cc] <= 8 && (idx === 0 || Math.random() < 0.45)) {
        // Smart BFS shortest-path pursuit for Lead Cat #0 within 8 steps
        filtered.sort((a, b) => {
          const da = playerBFSMap[a.nr][a.nc] >= 0 ? playerBFSMap[a.nr][a.nc] : 999;
          const db = playerBFSMap[b.nr][b.nc] >= 0 ? playerBFSMap[b.nr][b.nc] : 999;
          return da - db;
        });
        chosen = filtered[0];
      } else if (Math.random() < (idx === 0 ? 0.55 : 0.30)) {
        filtered.sort((a, b) => Math.hypot(a.nr - player.r, a.nc - player.c) - Math.hypot(b.nr - player.r, b.nc - player.c));
        chosen = filtered[0];
      } else {
        chosen = filtered[Math.floor(Math.random() * filtered.length)];
      }

      cat.lastR = cr; cat.lastC = cc;
      cat.targetR = chosen.nr; cat.targetC = chosen.nc;
    }

    function checkSmoothPlayerInteractions() {
      const { player, babies, cats, exitCell } = gameState;
      const spec = LEVELS[gameState.currentLevelIdx];

      let newlyRescued = false;
      babies.forEach(b => {
        if (!b.rescued && Math.hypot(b.r - player.r, b.c - player.c) < 0.62) {
          b.rescued = true;
          newlyRescued = true;
          gameState.score += 150;
          sound.playSqueak();
          spawnWorldJuice(b.r, b.c, '#fde047', 14, '+150 🐭');
        }
      });

      const rescuedCount = babies.filter(b => b.rescued).length;
      if (newlyRescued) {
        if (rescuedCount === spec.babies && !exitCell.unlocked) {
          exitCell.unlocked = true;
          showToast('✨ 出口已解鎖！快前往綠色光柱！', 'bg-emerald-400 text-slate-950');
        }
        updatePlayerBFS(true);
        updateFullLevelUI();
      }

      if (exitCell.unlocked && Math.hypot(exitCell.r - player.r, exitCell.c - player.c) < 0.62) {
        handleSeamlessLevelClear();
        return;
      }

      if (!isPlayerProtected()) {
        for (const cat of cats) {
          if (Math.hypot(cat.r - player.r, cat.c - player.c) < 0.50) {
            triggerHeavenDeathSequence();
            return;
          }
        }
      }
    }

    function triggerHeavenDeathSequence() {
      gameState.status = 'dying_heaven';
      gameState.lives--;
      gameState.virtualStick.active = false;
      highlightActiveDpadButton(null, 0, 0);
      gameState.player.heldDir = null;
      gameState.player.bufferedDir = null;
      sound.stopChaseBGM();
      sound.playHeavenAscensionSFX();
      gameState.deathAnim = {
        active: true,
        startTime: performance.now(),
        duration: 2000,
        r: gameState.player.r,
        c: gameState.player.c
      };
      updateHUDCountersOnly();
      showToast('👼 鼠媽媽升天了...', 'bg-sky-200 text-slate-900');
    }

    function updateDeathHeavenAnimation() {
      const elapsed = performance.now() - gameState.deathAnim.startTime;
      if (elapsed >= gameState.deathAnim.duration) {
        gameState.deathAnim.active = false;
        if (gameState.lives > 0) {
          loadLevel(gameState.currentLevelIdx, true, false);
        } else {
          handleOutOfThreeLivesSeamless();
        }
      }
    }

    // =========================================================================
    // 11. 3D SCENE SYNC & 2D OVERLAY RENDERING
    // =========================================================================
    function resizeCanvas() {
      const wrapper = document.getElementById('canvas-wrapper');
      const rect = wrapper.getBoundingClientRect();
      const w = Math.max(240, Math.floor(rect.width));
      const h = Math.max(240, Math.floor(rect.height));
      gameState.canvasSize = { width: w, height: h, left: rect.left, top: rect.top };

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxCanvas.width = Math.floor(w * dpr);
      fxCanvas.height = Math.floor(h * dpr);
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (engine3D.available && engine3D.renderer && engine3D.camera) {
        engine3D.renderer.setSize(w, h, false);
        engine3D.camera.aspect = w / h;
        engine3D.camera.updateProjectionMatrix();
      }
      renderFrame();
    }

    function syncAndRender3DScene(nowSec) {
      if (!engine3D.available || !engine3D.renderer || !engine3D.scene) return;
      const { player, babies, cats, exitCell, camera, deathAnim } = gameState;

      // 1. Update 3D Camera (elevated 3/4 isometric perspective following Mother Mouse)
      const span = Math.max(8, camera.visibleSpan);
      const camHeight = span * 1.18;
      const camBack = span * 0.56;
      engine3D.camera.position.set(camera.c, camHeight, camera.r + camBack);
      engine3D.camera.lookAt(camera.c, 0.15, camera.r - 0.15);

      // Follow shadow light with player so shadows stay razor-sharp on large 44x44 mazes
      engine3D.dirLight.position.set(camera.c + 8, 18, camera.r + 10);
      engine3D.dirLight.target.position.set(camera.c, 0, camera.r);
      engine3D.dirLight.target.updateMatrixWorld();

      // 2. Mother Mouse 3D Transform + Animation + Spawn Shield + Heaven Ascension
      if (engine3D.playerMesh) {
        const isMoving = player.moveDir.dr !== 0 || player.moveDir.dc !== 0;
        let py = isMoving ? Math.abs(Math.sin(player.walkPhase)) * 0.10 : 0;

        if (gameState.status === 'dying_heaven' && deathAnim.active) {
          const prog = Math.min(1, (performance.now() - deathAnim.startTime) / deathAnim.duration);
          py = prog * 4.2;
          engine3D.playerMesh.position.set(deathAnim.c, py, deathAnim.r);
          engine3D.playerMesh.rotation.y = nowSec * 2.5;
          if (engine3D.playerAngelGroup) {
            engine3D.playerAngelGroup.visible = true;
            const flap = Math.sin(nowSec * 18) * 0.45;
            engine3D.playerAngelGroup.userData.leftWing.rotation.x = flap;
            engine3D.playerAngelGroup.userData.rightWing.rotation.x = -flap;
          }
          if (engine3D.heavenBeamMesh) {
            engine3D.heavenBeamMesh.visible = true;
            engine3D.heavenBeamMesh.position.set(deathAnim.c, 3.2, deathAnim.r);
          }
        } else {
          engine3D.playerMesh.position.set(player.c, py, player.r);
          engine3D.playerMesh.rotation.y = -player.visualAngle;
          if (engine3D.playerAngelGroup) engine3D.playerAngelGroup.visible = false;
          if (engine3D.heavenBeamMesh) engine3D.heavenBeamMesh.visible = false;

          const ud = engine3D.playerMesh.userData;
          if (ud.tailPivot) ud.tailPivot.rotation.y = Math.sin(player.walkPhase * 1.4 + nowSec * 4) * 0.38;
          if (ud.paws) {
            ud.paws.forEach((paw, i) => {
              paw.position.x = (i < 2 ? 0.14 : -0.18) + (isMoving ? Math.sin(player.walkPhase + (i % 2 ? Math.PI : 0)) * 0.06 : 0);
            });
          }
        }

        const shieldActive = isPlayerProtected() && gameState.status === 'playing';
        if (engine3D.playerShieldMesh) {
          engine3D.playerShieldMesh.visible = shieldActive;
          if (shieldActive) {
            const pulse = 1 + Math.sin(nowSec * 10) * 0.05;
            engine3D.playerShieldMesh.scale.set(pulse, pulse, pulse);
          }
        }
        engine3D.playerLight.position.set(player.c, py + 1.1, player.r);
        engine3D.playerLight.color.set(shieldActive ? '#22d3ee' : '#fde68a');
      }

      // 3. Baby Mice (Hopping before rescue -> 3D Conga Line after rescue)
      let rescuedIdx = 0;
      babies.forEach((b, i) => {
        const mesh = engine3D.babyMeshes[i];
        if (!mesh) return;
        const ud = mesh.userData;
        if (!b.rescued) {
          const hop = Math.abs(Math.sin(nowSec * 5 + b.bobPhase)) * 0.14;
          mesh.position.set(b.c, hop, b.r);
          mesh.rotation.y = Math.sin(nowSec * 2 + b.bobPhase) * 0.8;
          if (ud.beaconRing) {
            ud.beaconRing.visible = true;
            const s = 0.9 + Math.sin(nowSec * 5 + b.bobPhase) * 0.15;
            ud.beaconRing.scale.set(s, s, 1);
          }
        } else {
          rescuedIdx++;
          const idxTrail = Math.min(rescuedIdx * 2, gameState.rescuedTrail.length - 1);
          const tp = gameState.rescuedTrail[idxTrail] || player;
          const hop = Math.abs(Math.sin(player.walkPhase - rescuedIdx * 0.7)) * 0.07;
          mesh.position.set(tp.c, hop, tp.r);
          mesh.rotation.y = -(tp.angle || 0);
          if (ud.beaconRing) ud.beaconRing.visible = false;
        }
      });

      // 4. Patrol Cats (Striding + Glowing Red Eyes & ! Alert when chasing)
      cats.forEach((cat, i) => {
        const mesh = engine3D.catMeshes[i];
        if (!mesh) return;
        mesh.position.set(cat.c, Math.abs(Math.sin(cat.stridePhase)) * 0.05, cat.r);
        mesh.rotation.y = -cat.visualAngle;
        const ud = mesh.userData;
        if (ud.tailPivot) ud.tailPivot.rotation.z = Math.sin(cat.stridePhase * 0.8) * 0.25;
        if (ud.legs) {
          ud.legs.forEach((leg, li) => {
            leg.rotation.z = Math.sin(cat.stridePhase + (li % 2 ? Math.PI : 0)) * 0.35;
          });
        }
        if (ud.eyeMat) {
          ud.eyeMat.color.set(cat.alerted ? '#ef4444' : '#a3e635');
          ud.eyeMat.emissive.set(cat.alerted ? '#dc2626' : '#65a30d');
        }
        if (ud.alertGroup) {
          ud.alertGroup.visible = !!cat.alerted;
          if (cat.alerted) ud.alertGroup.position.y = 0.92 + Math.sin(nowSec * 12) * 0.07;
        }
      });

      // 5. 3D Exit Portal Rings & Vertical Beacon Beam
      if (engine3D.exitGroup) {
        engine3D.exitRing1.rotation.y = nowSec * 2.2;
        engine3D.exitRing1.rotation.x = Math.sin(nowSec * 1.5) * 0.3;
        engine3D.exitRing2.rotation.y = -nowSec * 2.8;
        engine3D.exitRing2.rotation.z = Math.cos(nowSec * 1.8) * 0.3;
        if (exitCell.unlocked) {
          engine3D.exitPadMat.color.set('#10b981');
          engine3D.exitPadMat.emissive.set('#059669');
          engine3D.exitRingMat.color.set('#34d399');
          engine3D.exitBeam.visible = true;
        } else {
          engine3D.exitPadMat.color.set('#64748b');
          engine3D.exitPadMat.emissive.set('#334155');
          engine3D.exitRingMat.color.set('#94a3b8');
          engine3D.exitBeam.visible = false;
        }
      }

      // 6. Subtle Guide Orb Pulse
      if (engine3D.guideGroup && engine3D.guideGroup.children.length > 0) {
        engine3D.guideGroup.children.forEach((orb, idx) => {
          orb.position.y = 0.24 + Math.sin(nowSec * 6 - idx * 0.45) * 0.06;
        });
      }

      // 7. Sync 3D Dust & Rescue Sparkle Particles
      if (engine3D.particleInst) {
        const dummyP = new THREE.Object3D();
        const maxP = Math.min(48, gameState.fxParticles.length);
        engine3D.particleInst.count = maxP;
        for (let i = 0; i < maxP; i++) {
          const pt = gameState.fxParticles[i];
          const s = Math.max(0.15, pt.life / pt.maxLife);
          dummyP.position.set(pt.c, Math.max(0.05, pt.y || 0.15), pt.r);
          dummyP.scale.set(s, s, s);
          dummyP.updateMatrix();
          engine3D.particleInst.setMatrixAt(i, dummyP.matrix);
        }
        if (engine3D.particleInst.instanceMatrix) {
          engine3D.particleInst.instanceMatrix.needsUpdate = true;
        }
      }

      engine3D.renderer.render(engine3D.scene, engine3D.camera);
    }

    function drawCornerMinimap(ctx, w) {
      if (gameState.minimapCache.dirty) rebuildMinimapCache();
      const mini = gameState.minimapCache.canvas;
      const miniSize = mini.width;
      const pad = 8;
      const mx = w - miniSize - pad;
      const my = pad;
      ctx.drawImage(mini, mx, my);

      const rows = gameState.grid.length, cols = gameState.grid[0].length;
      const mCell = (miniSize - 8) / Math.max(rows, cols);
      const mOffX = mx + (miniSize - cols * mCell) / 2;
      const mOffY = my + (miniSize - rows * mCell) / 2;

      // Exit dot
      ctx.fillStyle = gameState.exitCell.unlocked ? '#34d399' : '#94a3b8';
      ctx.fillRect(mOffX + gameState.exitCell.c * mCell - 1.5, mOffY + gameState.exitCell.r * mCell - 1.5, 4.5, 4.5);

      // Unrescued babies
      ctx.fillStyle = '#fde047';
      gameState.babies.forEach(b => {
        if (!b.rescued) {
          ctx.beginPath();
          ctx.arc(mOffX + (b.c + 0.5) * mCell, mOffY + (b.r + 0.5) * mCell, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Cats
      ctx.fillStyle = '#fb7185';
      gameState.cats.forEach(cat => {
        ctx.beginPath();
        ctx.arc(mOffX + (cat.c + 0.5) * mCell, mOffY + (cat.r + 0.5) * mCell, 2.6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Mother Mouse
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(mOffX + (gameState.player.c + 0.5) * mCell, mOffY + (gameState.player.r + 0.5) * mCell, 3.0, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderFrame() {
      if (!gameState.grid.length) return;
      const nowSec = performance.now() / 1000;
      syncAndRender3DScene(nowSec);

      const { width: w, height: h } = gameState.canvasSize;
      fxCtx.clearRect(0, 0, w, h);

      // Floating Score Popups (projected near center-top of Mother Mouse)
      if (gameState.floatingTexts.length > 0) {
        fxCtx.save();
        fxCtx.font = '900 14px "Noto Sans TC", sans-serif';
        fxCtx.textAlign = 'center';
        gameState.floatingTexts.forEach(ft => {
          const alpha = Math.max(0, ft.life / ft.maxLife);
          const sx = w * 0.5 + (ft.c - gameState.camera.c) * 34;
          const sy = h * 0.45 + (ft.r - gameState.camera.r) * 30 - (1 - alpha) * 28;
          fxCtx.globalAlpha = alpha;
          fxCtx.fillStyle = '#0f172a';
          fxCtx.fillText(ft.text, sx + 1, sy + 1);
          fxCtx.fillStyle = ft.color;
          fxCtx.fillText(ft.text, sx, sy);
        });
        fxCtx.restore();
      }

      // Floating 4-Way Touch Stick Visual on Canvas
      if (gameState.virtualStick.active) {
        const vs = gameState.virtualStick;
        fxCtx.save();
        fxCtx.strokeStyle = 'rgba(255,255,255,0.45)';
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.arc(vs.originX, vs.originY, 28, 0, Math.PI * 2);
        fxCtx.stroke();
        fxCtx.fillStyle = 'rgba(250, 204, 21, 0.78)';
        fxCtx.beginPath();
        fxCtx.arc(vs.currX, vs.currY, 12, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      // Top-Right Corner Radar Minimap
      if (gameState.status !== 'all_clear_celebration') {
        drawCornerMinimap(fxCtx, w);
      }

      // Level 20 Deluxe Firecracker & Fireworks Celebration
      if (gameState.status === 'all_clear_celebration') {
        drawFirecrackerCelebration(fxCtx, w, h);
      }
    }

    // =========================================================================
    // 12. STRICT 4-WAY CARDINAL CONTROLS (RIGHT D-PAD, CANVAS STICK, KEYBOARD)
    // =========================================================================
    function highlightActiveDpadButton(dirCode, nubDx = 0, nubDy = 0) {
      const map = { U: 'dpad-up', D: 'dpad-down', L: 'dpad-left', R: 'dpad-right' };
      ['U', 'D', 'L', 'R'].forEach(k => {
        const el = document.getElementById(map[k]);
        if (el) {
          if (k === dirCode) el.classList.add('dpad-btn-active');
          else el.classList.remove('dpad-btn-active');
        }
      });
      const nub = document.getElementById('dpad-nub');
      if (nub) nub.style.transform = `translate(${nubDx}px, ${nubDy}px)`;
    }

    function setDirectDpadDirection(dirCode, nubDx = 0, nubDy = 0) {
      if (gameState.status !== 'playing' && dirCode !== null) return;
      if (!sound.ctx && dirCode) {
        sound.init();
        if (gameState.status === 'playing') sound.startChaseBGM();
      }
      highlightActiveDpadButton(dirCode, nubDx, nubDy);

      const codeToVec = (c) => {
        if (c === 'U') return { dr: -1, dc: 0 };
        if (c === 'D') return { dr: 1, dc: 0 };
        if (c === 'L') return { dr: 0, dc: -1 };
        if (c === 'R') return { dr: 0, dc: 1 };
        return null;
      };

      const vec = codeToVec(dirCode);
      const p = gameState.player;
      const dirChanged = !p.heldDir || !vec || p.heldDir.dr !== vec.dr || p.heldDir.dc !== vec.dc;
      p.heldDir = vec;
      if (!vec || gameState.status !== 'playing') return;

      // Instant 180-degree reversal mid-corridor
      if ((p.moveDir.dr !== 0 || p.moveDir.dc !== 0) && vec.dr === -p.moveDir.dr && vec.dc === -p.moveDir.dc) {
        const oldTR = p.targetR, oldTC = p.targetC;
        p.targetR = p.fromR; p.targetC = p.fromC;
        p.fromR = oldTR; p.fromC = oldTC;
        p.moveDir = { dr: vec.dr, dc: vec.dc };
        p.angle = Math.atan2(vec.dr, vec.dc);
        p.bufferedDir = null;
        return;
      }

      // Perpendicular turn buffering (280ms window) + guarded early-cell snap turn
      if (p.moveDir.dr !== 0 || p.moveDir.dc !== 0) {
        if (vec.dr !== p.moveDir.dr || vec.dc !== p.moveDir.dc) {
          const distFromOrigin = Math.hypot(p.r - p.fromR, p.c - p.fromC);
          if (dirChanged && distFromOrigin < 0.22 && canMoveFromCell(p.fromR, p.fromC, vec.dr, vec.dc)) {
            p.r = p.fromR; p.c = p.fromC;
            p.targetR = p.fromR + vec.dr; p.targetC = p.fromC + vec.dc;
            p.moveDir = { dr: vec.dr, dc: vec.dc };
            p.angle = Math.atan2(vec.dr, vec.dc);
            p.bufferedDir = null;
          } else {
            p.bufferedDir = { dr: vec.dr, dc: vec.dc };
            p.bufferedAt = Date.now();
          }
        }
      }
    }

    function pickCardinalWithHysteresis(dx, dy) {
      const cur = gameState.player.heldDir;
      if (cur && cur.dc !== 0) {
        return Math.abs(dy) > Math.abs(dx) * 1.18 ? (dy > 0 ? 'D' : 'U') : (dx >= 0 ? 'R' : 'L');
      } else if (cur && cur.dr !== 0) {
        return Math.abs(dx) > Math.abs(dy) * 1.18 ? (dx > 0 ? 'R' : 'L') : (dy >= 0 ? 'D' : 'U');
      }
      return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
    }

    function bindControls() {
      document.getElementById('btn-StartFromHome').addEventListener('click', closeHomeMenuAndPlay);
      document.getElementById('btn-ReturnHome').addEventListener('click', openHomeMenuScreen);

      const toggleAudio = () => {
        sound.bgmEnabled = !sound.bgmEnabled;
        document.getElementById('bgm-icon').textContent = sound.bgmEnabled ? '🔊' : '🔇';
        renderHomeMenuUI();
        if (sound.bgmEnabled && gameState.status === 'playing') sound.startChaseBGM();
        else sound.stopChaseBGM();
      };
      document.getElementById('btn-HomeToggleAudio').addEventListener('click', toggleAudio);
      document.getElementById('btn-ToggleBGM').addEventListener('click', toggleAudio);

      document.getElementById('home-slider-cam').addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        gameState.camera.visibleSpan = Math.max(8, val);
        document.getElementById('home-cam-label').textContent = `${val}×${val}`;
        renderFrame();
      });

      document.getElementById('btn-Pause').addEventListener('click', togglePause);
      document.getElementById('btn-Restart').addEventListener('click', () => loadLevel(gameState.currentLevelIdx, true, true));

      document.getElementById('btn-ToggleBFS').addEventListener('click', () => {
        if (!isGuideAllowedForCurrentLevel()) return;
        gameState.showBFSOverlay = !gameState.showBFSOverlay;
        updatePlayerBFS(true);
        updateFullLevelUI();
        renderFrame();
      });

      document.getElementById('canvas-overlay').addEventListener('pointerdown', (e) => {
        if (gameState.status === 'all_clear_celebration' && e.target.id === 'canvas-overlay') {
          const rect = document.getElementById('canvas-wrapper').getBoundingClientRect();
          spawnFirecrackerBurst(e.clientX - rect.left, e.clientY - rect.top, 46, true);
          sound.playBigFireworkBoom(0);
        }
      });

      // Right-Side Strict 4-Way D-Pad with 1.18x Diagonal Hysteresis
      const dpadContainer = document.getElementById('dpad-pad');
      let dpadPointerId = null;
      let dpadCenter = { x: 0, y: 0 };

      const updateDpadFromPointer = (clientX, clientY) => {
        if (gameState.status !== 'playing') return;
        const dx = clientX - dpadCenter.x;
        const dy = clientY - dpadCenter.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 8) { setDirectDpadDirection(null, 0, 0); return; }
        const clampDist = Math.min(14, dist * 0.32);
        const ang = Math.atan2(dy, dx);
        const code = pickCardinalWithHysteresis(dx, dy);
        setDirectDpadDirection(code, Math.cos(ang) * clampDist, Math.sin(ang) * clampDist);
      };

      dpadContainer.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState.status !== 'playing') return;
        const rect = dpadContainer.getBoundingClientRect();
        dpadCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        dpadPointerId = e.pointerId;
        if (dpadContainer.setPointerCapture) {
          try { dpadContainer.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateDpadFromPointer(e.clientX, e.clientY);
      });

      dpadContainer.addEventListener('pointermove', (e) => {
        if (dpadPointerId !== e.pointerId) return;
        e.preventDefault();
        updateDpadFromPointer(e.clientX, e.clientY);
      });

      const stopDpad = (e) => {
        if (dpadPointerId !== null && e.pointerId !== undefined && dpadPointerId !== e.pointerId) return;
        dpadPointerId = null;
        setDirectDpadDirection(null, 0, 0);
      };
      dpadContainer.addEventListener('pointerup', stopDpad);
      dpadContainer.addEventListener('pointercancel', stopDpad);

      // Canvas Floating 4-Way Stick
      webglCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState.status !== 'playing') return;
        if (!sound.ctx) { sound.init(); sound.startChaseBGM(); }
        const rect = document.getElementById('canvas-wrapper').getBoundingClientRect();
        gameState.canvasSize = { width: rect.width, height: rect.height, left: rect.left, top: rect.top };
        if (webglCanvas.setPointerCapture) {
          try { webglCanvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
        const lx = e.clientX - rect.left, ly = e.clientY - rect.top;
        gameState.virtualStick = { active: true, pointerId: e.pointerId, originX: lx, originY: ly, currX: lx, currY: ly };
      });

      webglCanvas.addEventListener('pointermove', (e) => {
        const vs = gameState.virtualStick;
        if (!vs.active || vs.pointerId !== e.pointerId) return;
        e.preventDefault();
        vs.currX = e.clientX - gameState.canvasSize.left;
        vs.currY = e.clientY - gameState.canvasSize.top;
        const dx = vs.currX - vs.originX, dy = vs.currY - vs.originY;
        const dist = Math.hypot(dx, dy);
        if (dist < 10) { setDirectDpadDirection(null, 0, 0); return; }
        if (dist > 34) {
          const ang = Math.atan2(dy, dx);
          vs.originX = vs.currX - Math.cos(ang) * 28;
          vs.originY = vs.currY - Math.sin(ang) * 28;
        }
        const code = pickCardinalWithHysteresis(dx, dy);
        setDirectDpadDirection(code, 0, 0);
      });

      const endCanvasStick = () => {
        if (gameState.virtualStick.active) {
          gameState.virtualStick.active = false;
          gameState.virtualStick.pointerId = null;
          setDirectDpadDirection(null, 0, 0);
        }
      };
      webglCanvas.addEventListener('pointerup', endCanvasStick);
      webglCanvas.addEventListener('pointercancel', endCanvasStick);

      // Keyboard Controls (WASD / Arrows — NO Dash Key)
      const heldDirs = [];
      const keyToCode = (k) => {
        if (k === 'ArrowUp' || k === 'w' || k === 'W') return 'U';
        if (k === 'ArrowDown' || k === 's' || k === 'S') return 'D';
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') return 'L';
        if (k === 'ArrowRight' || k === 'd' || k === 'D') return 'R';
        return null;
      };

      window.addEventListener('keydown', (e) => {
        if (gameState.status !== 'playing') return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        const code = keyToCode(e.key);
        if (code) {
          const idx = heldDirs.indexOf(code);
          if (idx !== -1) heldDirs.splice(idx, 1);
          heldDirs.push(code);
          setDirectDpadDirection(code, 0, 0);
        }
      });

      window.addEventListener('keyup', (e) => {
        const code = keyToCode(e.key);
        if (code) {
          const idx = heldDirs.indexOf(code);
          if (idx !== -1) heldDirs.splice(idx, 1);
          setDirectDpadDirection(heldDirs.length > 0 ? heldDirs[heldDirs.length - 1] : null, 0, 0);
        }
      });

      window.addEventListener('blur', () => {
        heldDirs.length = 0;
        setDirectDpadDirection(null, 0, 0);
      });

      window.addEventListener('resize', resizeCanvas);
    }

    window.onload = () => {
      init3DEngine();
      bindControls();
      loadLevel(0, false, true);
      openHomeMenuScreen();
      setTimeout(resizeCanvas, 40);
    };
  </script>
